name: Burnside Production 08

on:
  push:
    branches:
      - feat/burnside-production-08-companion-presence
    paths:
      - "docs/superpowers/specs/2026-09-04-burnside-production-08-companion-presence-design.md"
      - "docs/superpowers/plans/2026-09-06-burnside-production-08-companion-presence.md"
      - ".github/workflows/burnside-production-08.yml"
      - "godot/scripts/entities/fb13_companion_body.gd"
      - "godot/scenes/entities/fb13_companion_body.tscn"
      - "godot/scenes/entities/hs7_carried_module.tscn"
      - "godot/scripts/world/burnside_companion_presence_runtime.gd"
      - "godot/scenes/player/runner.tscn"
      - "godot/scenes/vehicles/courier_bike.tscn"
      - "godot/scenes/vehicles/scrap_hauler.tscn"
      - "godot/scenes/prototype/scrap_test_block.tscn"
      - "godot/scripts/prototype/scrap_test_block.gd"
      - "godot/tests/companion_presence_semantics_test.gd"
      - "godot/tests/companion_vehicle_docking_test.gd"
      - "godot/tests/companion_thrum_replay_mission03_test.gd"
      - "godot/tests/companion_presence_windowed_probe.gd"
  pull_request:
    paths:
      - "docs/superpowers/specs/2026-09-04-burnside-production-08-companion-presence-design.md"
      - "docs/superpowers/plans/2026-09-06-burnside-production-08-companion-presence.md"
      - ".github/workflows/burnside-production-08.yml"
      - "godot/scripts/entities/fb13_companion_body.gd"
      - "godot/scenes/entities/fb13_companion_body.tscn"
      - "godot/scenes/entities/hs7_carried_module.tscn"
      - "godot/scripts/world/burnside_companion_presence_runtime.gd"
      - "godot/scenes/player/runner.tscn"
      - "godot/scenes/vehicles/courier_bike.tscn"
      - "godot/scenes/vehicles/scrap_hauler.tscn"
      - "godot/scenes/prototype/scrap_test_block.tscn"
      - "godot/scripts/prototype/scrap_test_block.gd"
      - "godot/tests/companion_presence_semantics_test.gd"
      - "godot/tests/companion_vehicle_docking_test.gd"
      - "godot/tests/companion_thrum_replay_mission03_test.gd"
      - "godot/tests/companion_presence_windowed_probe.gd"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"

jobs:
  focused-p08:
    name: Exact-source P08 semantics/runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1
      - name: Install Godot 4.7.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
      - name: Prime exact-source Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit
          test -s godot/.godot/global_script_class_cache.cfg
      - name: Companion presence semantics
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/companion_presence_semantics_test.gd
      - name: Companion vehicle docking
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/companion_vehicle_docking_test.gd
      - name: Companion Thrum / Replay / Mission 03 composition
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/companion_thrum_replay_mission03_test.gd

  retained-regressions:
    name: Exact-source retained P01-P07 regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1
      - name: Install Godot 4.7.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
      - name: Prime exact-source Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit
          test -s godot/.godot/global_script_class_cache.cfg
      - name: Run retained production regression matrix
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            vehicle_condition_semantics_test.gd
            burn_garage_repair_runtime_test.gd
            burn_garage_mission02_composition_test.gd
            vehicle_condition_runtime_collision_test.gd
            gears_surveyed_route_progress_store_test.gd
            gears_surveyed_service_cut_test.gd
            gears_surveyed_service_cut_input_test.gd
            gears_scrapper_tool_input_test.gd
            gears_scrapper_tool_input_lock_test.gd
            gears_scrapper_tool_environment_test.gd
            gears_scrapper_tool_pursuer_test.gd
            gears_scrapper_tool_mission_ordering_test.gd
            gears_work_zone_incident_test.gd
            gears_work_zone_mission_ordering_test.gd
            civic_repossession_pretriggered_suppression_test.gd
            civic_repossession_wanted_composition_test.gd
            field_hacking_report_suppression_test.gd
            wanted_heat1_scene_test.gd
          )
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            timeout --signal=TERM 30s "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot \
              --script "res://tests/$test_file"
            echo "::endgroup::"
          done
