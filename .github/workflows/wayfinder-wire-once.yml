name: Wire Burnside Wayfinder graph (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wayfinder-wire-once.yml

permissions:
  contents: read
  issues: write

jobs:
  wire:
    if: github.repository == 'JOHNNYMACONNY/art'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      API_VERSION: '2026-03-10'
    steps:
      - name: Wire native sub-issues
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$@"
          }

          issue_id() {
            api "/repos/${REPO}/issues/$1" --jq '.id'
          }

          existing_subs="$(api "/repos/${REPO}/issues/101/sub_issues?per_page=100" --jq '.[].number')"

          for n in $(seq 102 112); do
            if grep -qx "${n}" <<<"${existing_subs}"; then
              echo "#${n} already a child of #101"
              continue
            fi

            id="$(issue_id "${n}")"
            api --method POST \
              "/repos/${REPO}/issues/101/sub_issues" \
              -F "sub_issue_id=${id}" >/dev/null
            echo "Added #${n} as child of #101"
            sleep 1
          done

      - name: Wire native blocked-by dependencies
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$@"
          }

          issue_id() {
            api "/repos/${REPO}/issues/$1" --jq '.id'
          }

          add_blocked_by() {
            local target="$1"
            local blocker="$2"
            local existing
            existing="$(api "/repos/${REPO}/issues/${target}/dependencies/blocked_by?per_page=100" --jq '.[].number')"

            if grep -qx "${blocker}" <<<"${existing}"; then
              echo "#${target} already blocked by #${blocker}"
              return 0
            fi

            local id
            id="$(issue_id "${blocker}")"
            api --method POST \
              "/repos/${REPO}/issues/${target}/dependencies/blocked_by" \
              -F "issue_id=${id}" >/dev/null
            echo "Added dependency: #${target} blocked by #${blocker}"
            sleep 1
          }

          for blocker in 102 103 104 106; do add_blocked_by 108 "${blocker}"; done
          for blocker in 102 106; do add_blocked_by 109 "${blocker}"; done
          for blocker in 104 105 108; do add_blocked_by 110 "${blocker}"; done
          for blocker in 104 106 108; do add_blocked_by 111 "${blocker}"; done
          for blocker in 105 107 108 109 110 111; do add_blocked_by 112 "${blocker}"; done

      - name: Verify canonical graph
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$@"
          }

          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          subs="$(api "/repos/${REPO}/issues/101/sub_issues?per_page=100" --jq 'map(.number) | sort | join(",")')"
          [[ "${subs}" == '102,103,104,105,106,107,108,109,110,111,112' ]] || fail "unexpected sub-issue set: ${subs}"

          map_label="$(api "/repos/${REPO}/issues/101" --jq '[.labels[].name] | index("wayfinder:map") != null')"
          [[ "${map_label}" == 'true' ]] || fail '#101 missing wayfinder:map'

          expected_blockers() {
            case "$1" in
              102|103|104|105|106|107) echo '' ;;
              108) echo '102,103,104,106' ;;
              109) echo '102,106' ;;
              110) echo '104,105,108' ;;
              111) echo '104,106,108' ;;
              112) echo '105,107,108,109,110,111' ;;
              *) fail "no expected blocker set for #$1" ;;
            esac
          }

          for n in $(seq 102 112); do
            issue_json="$(api "/repos/${REPO}/issues/${n}")"
            state="$(jq -r '.state' <<<"${issue_json}")"
            [[ "${state}" == 'open' ]] || fail "#${n} is not open"

            assignee_count="$(jq '.assignees | length' <<<"${issue_json}")"
            [[ "${assignee_count}" == '0' ]] || fail "#${n} is assigned"

            has_label="$(jq '[.labels[].name] | index("wayfinder:grilling") != null' <<<"${issue_json}")"
            [[ "${has_label}" == 'true' ]] || fail "#${n} missing wayfinder:grilling"

            actual="$(api "/repos/${REPO}/issues/${n}/dependencies/blocked_by?per_page=100" --jq 'map(.number) | sort | join(",")')"
            expected="$(expected_blockers "${n}")"
            [[ "${actual}" == "${expected}" ]] || fail "#${n} blockers=${actual}; expected=${expected}"
          done

          echo 'Verified frontier: #102 #103 #104 #105 #106 #107'
