name: Burnside Production 16

on:
  push:
    branches:
      - main
      - feat/production-16-memory-disclosure-choice
    paths:
      - "contracts/burnside_production_16_memory_disclosure_choice_spec.md"
      - ".github/workflows/burnside-production-16.yml"
      - "godot/scripts/missions/city_that_forgot_mission.gd"
      - "godot/scripts/missions/city_that_forgot_runtime.gd"
      - "godot/scripts/interactions/memory_disclosure_relay.gd"
      - "godot/tests/burnside_mission03_memory_disclosure_test.gd"
      - "godot/tests/burnside_production16_memory_disclosure_render_capture.gd"
      - "godot/tests/burnside_production16_memory_disclosure_render_capture.gd"
      - "godot/tests/city_that_forgot_mission_contract_test.gd"
      - "godot/tests/field_hacking_report_suppression_test.gd"
      - "godot/tests/burnside_checkpoint_courier_recognition_test.gd"
  pull_request:
    paths:
      - "contracts/burnside_production_16_memory_disclosure_choice_spec.md"
      - ".github/workflows/burnside-production-16.yml"
      - "godot/scripts/missions/city_that_forgot_mission.gd"
      - "godot/scripts/missions/city_that_forgot_runtime.gd"
      - "godot/scripts/interactions/memory_disclosure_relay.gd"
      - "godot/tests/burnside_mission03_memory_disclosure_test.gd"
      - "godot/tests/city_that_forgot_mission_contract_test.gd"
      - "godot/tests/field_hacking_report_suppression_test.gd"
      - "godot/tests/burnside_checkpoint_courier_recognition_test.gd"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"

jobs:
  memory-disclosure:
    name: Exact-source P16 Memory Disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1
      - name: Install Godot 4.7.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
      - name: Prime exact-source Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit
          test -s godot/.godot/global_script_class_cache.cfg
      - name: P16 memory disclosure tracer
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 180s "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/burnside_mission03_memory_disclosure_test.gd
      - name: Retained Mission / Wanted / P15 regressions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in touch_controls_event_routing_test.gd field_hacking_report_suppression_test.gd burnside_checkpoint_courier_recognition_test.gd; do
            timeout --signal=TERM 180s "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script "res://tests/$test_file"
          done


  rendered-proof:
    name: Windowed P16 Memory Disclosure proof
    needs: memory-disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Cache Godot editor
        id: godot-cache-render
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1
      - name: Install Godot 4.7.1
        if: steps.godot-cache-render.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
      - name: Prime exact-source Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit
          test -s godot/.godot/global_script_class_cache.cfg
      - name: Capture Production 16 aftermath states
        shell: bash
        run: |
          set -euo pipefail
          rm -rf godot/verification/production16
          SOURCE_SHA="$SOURCE_SHA" timeout --signal=TERM 120s xvfb-run -a "$GODOT_BIN" --rendering-method gl_compatibility --path godot --script res://tests/burnside_production16_memory_disclosure_render_capture.gd
          test -s godot/verification/production16/01_relays_dormant.png
          test -s godot/verification/production16/02_choice_ready.png
          test -s godot/verification/production16/03_archive_released.png
          test -s godot/verification/production16/04_archive_sealed.png
          test -s godot/verification/production16/render_report.json
      - name: Upload Production 16 rendered proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production16-rendered-proof-${{ env.SOURCE_SHA }}
          path: godot/verification/production16
          if-no-files-found: error
          retention-days: 14
