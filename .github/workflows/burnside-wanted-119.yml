name: Burnside Wanted 119

on:
  push:
    branches:
      - "chatgpt/burnside-wanted-119"
    paths:
      - "godot/project.godot"
      - "godot/scripts/world/wanted_authority.gd"
      - "godot/scripts/world/wanted_heat1_runtime.gd"
      - "godot/scripts/interactions/civic_service_alarm.gd"
      - "godot/scenes/interactions/civic_service_alarm.tscn"
      - "godot/scripts/prototype/scrap_test_block.gd"
      - "godot/scenes/prototype/scrap_test_block.tscn"
      - "godot/tests/wanted_heat1_contract_test.gd"
      - "godot/tests/wanted_heat1_contract_runner.gd"
      - "godot/tests/wanted_heat1_scene_test.gd"
      - "godot/tests/wanted_heat1_render_capture.gd"
      - "godot/tests/wanted_hud_layout_test.gd"
      - ".github/workflows/burnside-wanted-119.yml"
  pull_request:
    paths:
      - "godot/project.godot"
      - "godot/scripts/world/wanted_authority.gd"
      - "godot/scripts/world/wanted_heat1_runtime.gd"
      - "godot/scripts/interactions/civic_service_alarm.gd"
      - "godot/scenes/interactions/civic_service_alarm.tscn"
      - "godot/scripts/prototype/scrap_test_block.gd"
      - "godot/scenes/prototype/scrap_test_block.tscn"
      - "godot/tests/wanted_heat1_contract_test.gd"
      - "godot/tests/wanted_heat1_contract_runner.gd"
      - "godot/tests/wanted_heat1_scene_test.gd"
      - "godot/tests/wanted_heat1_render_capture.gd"
      - "godot/tests/wanted_hud_layout_test.gd"
      - ".github/workflows/burnside-wanted-119.yml"

permissions:
  contents: read

jobs:
  wanted-heat1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Godot 4.7.1 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"

      - name: Prime Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit

      - name: Run Heat-1 knowledge contract
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path godot \
            --script res://tests/wanted_heat1_contract_runner.gd

      - name: Run real-scene Heat-1 tracer
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path godot \
            --script res://tests/wanted_heat1_scene_test.gd

      - name: Run Wanted HUD lane regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path godot \
            --script res://tests/wanted_hud_layout_test.gd

      - name: Run retained desktop authority regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path godot \
            --script res://tests/desktop_vehicle_authority_test.gd

      - name: Capture windowed rendered Heat-1 proof
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a \
            "$GODOT_BIN" \
            --rendering-method gl_compatibility \
            --path godot \
            --script res://tests/wanted_heat1_render_capture.gd
          test -s godot/verification/wanted/01_report_contact.png
          test -s godot/verification/wanted/02_search_last_known.png
          test -s godot/verification/wanted/03_evaded_clear.png
          test -s godot/verification/wanted/render_report.json

      - name: Upload rendered Heat-1 proof
        uses: actions/upload-artifact@v4
        with:
          name: wanted-heat1-proof-${{ env.SOURCE_SHA }}
          path: godot/verification/wanted/
          if-no-files-found: error
          retention-days: 14
