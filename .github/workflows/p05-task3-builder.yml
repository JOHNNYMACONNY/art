name: P05 Task 3 Builder

on:
  push:
    branches:
      - "automation/p05-task3-build"
    paths:
      - ".github/workflows/p05-task3-builder.yml"

permissions:
  contents: write

jobs:
  build-task3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch Task 3 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('godot/scripts/player/runner.gd')
          text = path.read_text()
          old = 'func set_joystick_input(vec: Vector2) -> void:\n\tjoystick_vector = vec\n\n'
          new = '''func set_joystick_input(vec: Vector2) -> void:
          \tjoystick_vector = vec

          func get_facing_direction() -> Vector3:
          \tvar facing_basis := mesh_pivot.global_transform.basis if mesh_pivot != null else global_transform.basis
          \tvar facing := Vector3(-facing_basis.z.x, 0.0, -facing_basis.z.z)
          \tif facing.length_squared() <= 0.001:
          \t\treturn Vector3.FORWARD
          \treturn facing.normalized()

          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('runner facing insertion point drifted')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > godot/scripts/world/gears_scrapper_tool_runtime.gd <<'EOF'
          class_name GearsScrapperToolRuntime
          extends Node3D

          const ScrapperToolPickupScene = preload("res://scenes/interactions/scrapper_tool_pickup.tscn")

          const SWING_IMPACT_SEC := 0.14
          const SWING_TOTAL_SEC := 0.60
          const TOOL_REACH_M := 1.8
          const TOOL_FORWARD_DOT := 0.5

          enum AccessState { JAMMED, FORCED_OPEN }

          var _root_controller: Node = null
          var _district: Node3D = null
          var _touch_ui: Node = null
          var _player: Node3D = null
          var _pickup: ScrapperToolPickup = null
          var _held_visual: MeshInstance3D = null
          var _held: bool = false
          var _configured: bool = false

          var _access_state: AccessState = AccessState.JAMMED
          var _access_barrier: StaticBody3D = null
          var _access_mesh: MeshInstance3D = null
          var _access_collision: CollisionShape3D = null

          var _swing_active: bool = false
          var _swing_elapsed: float = 0.0
          var _swing_origin: Vector3 = Vector3.ZERO
          var _swing_facing: Vector3 = Vector3.FORWARD
          var _contact_evaluated: bool = false
          var _contact_evaluation_count: int = 0
          var _last_contact: String = "NONE"

          func _process(delta: float) -> void:
          	if _configured:
          		process_tool_state(delta)

          func configure(root_controller: Node, district: Node3D) -> bool:
          	if root_controller == null or district == null:
          		return false
          	var touch_ui := root_controller.get_node_or_null("CanvasLayer/TouchControlsUI")
          	var player := root_controller.get_node_or_null("Runner") as Node3D
          	var socket := district.get_node_or_null("ServiceAlleyEntrySocket") as Marker3D
          	if touch_ui == null or player == null or socket == null:
          		return false
          	if not touch_ui.has_signal("action_button_pressed") or not touch_ui.has_signal("tool_action_pressed") or not touch_ui.has_signal("replay_pressed"):
          		return false
          	if not player.has_method("get_facing_direction"):
          		return false

          	_root_controller = root_controller
          	_district = district
          	_touch_ui = touch_ui
          	_player = player

          	_pickup = ScrapperToolPickupScene.instantiate() as ScrapperToolPickup
          	if _pickup == null:
          		return false
          	_pickup.name = "ScrapperToolPickup"
          	_root_controller.add_child(_pickup)
          	_pickup.global_position = socket.global_position + Vector3(1.15, 0.55, 0.95)

          	var interactables = _root_controller.get("_interactables")
          	if interactables is Array and not interactables.has(_pickup):
          		interactables.append(_pickup)

          	_ensure_held_visual()
          	_ensure_access_barrier(socket)
          	_touch_ui.call("set_tool_action_available", false)

          	var action_callable := Callable(self, "_on_action_pressed")
          	if not _touch_ui.is_connected("action_button_pressed", action_callable):
          		_touch_ui.connect("action_button_pressed", action_callable)
          	var tool_callable := Callable(self, "handle_tool_action_pressed")
          	if not _touch_ui.is_connected("tool_action_pressed", tool_callable):
          		_touch_ui.connect("tool_action_pressed", tool_callable)
          	var replay_callable := Callable(self, "reset_runtime")
          	if not _touch_ui.is_connected("replay_pressed", replay_callable):
          		_touch_ui.connect("replay_pressed", replay_callable)

          	_configured = true
          	return true

          func _ensure_held_visual() -> void:
          	if _held_visual != null or _player == null:
          		return
          	var mesh := BoxMesh.new()
          	mesh.size = Vector3(0.12, 0.12, 0.82)
          	_held_visual = MeshInstance3D.new()
          	_held_visual.name = "HeldScrapperTool"
          	_held_visual.mesh = mesh
          	_held_visual.position = Vector3(0.34, 0.58, -0.38)
          	_held_visual.rotation = Vector3(0.15, 0.0, 0.55)
          	_held_visual.visible = false
          	_player.add_child(_held_visual)

          func _ensure_access_barrier(socket: Marker3D) -> void:
          	if _access_barrier != null:
          		return
          	_access_barrier = StaticBody3D.new()
          	_access_barrier.name = "JammedServiceAccess"
          	add_child(_access_barrier)
          	_access_barrier.global_position = socket.global_position + Vector3(0.0, 0.82, 0.0)

          	var box_mesh := BoxMesh.new()
          	box_mesh.size = Vector3(3.3, 1.55, 0.28)
          	_access_mesh = MeshInstance3D.new()
          	_access_mesh.name = "BarrierMesh"
          	_access_mesh.mesh = box_mesh
          	_access_barrier.add_child(_access_mesh)

          	var box_shape := BoxShape3D.new()
          	box_shape.size = Vector3(3.3, 1.55, 0.28)
          	_access_collision = CollisionShape3D.new()
          	_access_collision.name = "CollisionShape3D"
          	_access_collision.shape = box_shape
          	_access_barrier.add_child(_access_collision)

          func _on_action_pressed() -> void:
          	acquire_active_pickup()

          func handle_action_pressed() -> bool:
          	return acquire_active_pickup()

          func acquire_active_pickup() -> bool:
          	if not _configured or _held or _pickup == null or not is_instance_valid(_pickup):
          		return false
          	if _root_controller.get("_active_target") != _pickup:
          		return false
          	if _player == null:
          		return false
          	_pickup.update_player_distance(_player.global_position)
          	if not _pickup.can_interact(_player.global_position):
          		return false
          	if not _pickup.acquire():
          		return false
          	_held = true
          	if _held_visual:
          		_held_visual.visible = true
          	_touch_ui.call("set_tool_action_available", true)
          	return true

          func handle_tool_action_pressed() -> bool:
          	if not _configured or not _held or _touch_ui == null or _player == null:
          		return false
          	if _swing_active:
          		return false
          	if int(_touch_ui.get("current_mode")) != int(TouchControlsUI.UIMode.FOOT_TRAVERSAL):
          		return false
          	var facing: Vector3 = _player.call("get_facing_direction")
          	facing.y = 0.0
          	if facing.length_squared() <= 0.001:
          		return false
          	_swing_origin = _player.global_position
          	_swing_facing = facing.normalized()
          	_swing_elapsed = 0.0
          	_contact_evaluated = false
          	_swing_active = true
          	_last_contact = "PENDING"
          	return true

          func process_tool_state(delta: float) -> void:
          	if not _swing_active:
          		return
          	_swing_elapsed += maxf(delta, 0.0)
          	if not _contact_evaluated and _swing_elapsed >= SWING_IMPACT_SEC:
          		_contact_evaluated = true
          		_evaluate_contact_once()
          	if _swing_elapsed >= SWING_TOTAL_SEC:
          		_swing_active = false
          		_swing_elapsed = 0.0

          func _candidate_distance(target_position: Vector3) -> float:
          	var delta := target_position - _swing_origin
          	delta.y = 0.0
          	if delta.length_squared() <= 0.001:
          		return 0.0
          	var distance := delta.length()
          	if distance > TOOL_REACH_M:
          		return INF
          	if _swing_facing.dot(delta / distance) < TOOL_FORWARD_DOT:
          		return INF
          	return distance

          func _evaluate_contact_once() -> void:
          	_contact_evaluation_count += 1
          	var best_distance := INF
          	var best_kind := "MISS"

          	if _access_state == AccessState.JAMMED and _access_barrier != null:
          		var access_distance := _candidate_distance(_access_barrier.global_position)
          		if access_distance < best_distance:
          			best_distance = access_distance
          			best_kind = "SERVICE_ACCESS"

          	var pursuer := _root_controller.get_node_or_null("PursuerPrototype") as Node3D
          	if pursuer != null and bool(pursuer.get("is_active")):
          		var pursuer_distance := _candidate_distance(pursuer.global_position)
          		if pursuer_distance < best_distance:
          			best_distance = pursuer_distance
          			best_kind = "PURSUER"

          	_last_contact = best_kind
          	if best_kind == "SERVICE_ACCESS":
          		_force_access_open()
          	elif best_kind == "PURSUER" and pursuer != null and pursuer.has_method("apply_scrapper_stagger"):
          		pursuer.call("apply_scrapper_stagger", _swing_facing)

          func _force_access_open() -> bool:
          	if _access_state != AccessState.JAMMED:
          		return false
          	_access_state = AccessState.FORCED_OPEN
          	if _access_collision != null:
          		_access_collision.set_deferred("disabled", true)
          	if _access_mesh != null:
          		_access_mesh.position.y = -0.9
          		_access_mesh.rotation.z = 0.42
          	return true

          func has_tool() -> bool:
          	return _held

          func get_pickup() -> ScrapperToolPickup:
          	return _pickup

          func get_access_barrier() -> StaticBody3D:
          	return _access_barrier

          func get_access_state_name() -> String:
          	return AccessState.keys()[_access_state]

          func is_service_access_blocking() -> bool:
          	return _access_state == AccessState.JAMMED and _access_collision != null and not _access_collision.disabled

          func get_contact_evaluation_count() -> int:
          	return _contact_evaluation_count

          func get_last_contact_name() -> String:
          	return _last_contact

          func is_swing_active() -> bool:
          	return _swing_active

          func reset_runtime() -> void:
          	_held = false
          	_swing_active = false
          	_swing_elapsed = 0.0
          	_contact_evaluated = false
          	_contact_evaluation_count = 0
          	_last_contact = "NONE"
          	_access_state = AccessState.JAMMED
          	if _pickup != null and is_instance_valid(_pickup):
          		_pickup.reset_pickup()
          	if _held_visual != null and is_instance_valid(_held_visual):
          		_held_visual.visible = false
          	if _access_collision != null and is_instance_valid(_access_collision):
          		_access_collision.set_deferred("disabled", false)
          	if _access_mesh != null and is_instance_valid(_access_mesh):
          		_access_mesh.position = Vector3.ZERO
          		_access_mesh.rotation = Vector3.ZERO
          	if _touch_ui != null and is_instance_valid(_touch_ui):
          		_touch_ui.call("set_tool_action_available", false)
          EOF

          cat > godot/tests/gears_scrapper_tool_environment_test.gd <<'EOF'
          extends SceneTree

          var _scene: Node = null
          var _wanted_runtime: Node = null

          func _init() -> void:
          	call_deferred("_run")

          func _finish(code: int) -> void:
          	if is_instance_valid(_scene):
          		_scene.queue_free()
          		await process_frame
          		await process_frame
          	if _wanted_runtime != null and _wanted_runtime.has_method("reset_runtime"):
          		_wanted_runtime.call("reset_runtime")
          	quit(code)

          func _fail(message: String) -> void:
          	push_error("[GEARS_SCRAPPER_TOOL_ENVIRONMENT] %s" % message)
          	await _finish(1)

          func _run() -> void:
          	_wanted_runtime = root.get_node_or_null("BurnsideWantedRuntime")
          	if _wanted_runtime == null:
          		await _fail("BurnsideWantedRuntime autoload is missing")
          		return
          	var packed := load("res://scenes/prototype/scrap_test_block.tscn") as PackedScene
          	if packed == null:
          		await _fail("Production scene could not load")
          		return
          	_scene = packed.instantiate()
          	root.add_child(_scene)
          	await process_frame
          	await physics_frame
          	await process_frame
          	await process_frame
          	if not bool(_wanted_runtime.call("bind_to_scene", _scene)):
          		await _fail("Wanted runtime did not bind to the production scene")
          		return

          	var district := _scene.get_node_or_null("GearsDistrictSlice01B")
          	var player := _scene.get_node_or_null("Runner") as Node3D
          	var runtime := _scene.get_node_or_null("GearsScrapperToolRuntime")
          	if district == null or player == null or runtime == null:
          		await _fail("P05 environment fixture is incomplete")
          		return
          	var district_contract: Dictionary = district.call("get_production_contract")
          	if not bool(district_contract.get("owns_no_gameplay_authority", false)):
          		await _fail("Retained Gears district authority boundary regressed")
          		return
          	if not player.has_method("get_facing_direction"):
          		await _fail("Player facing read seam is missing")
          		return
          	for method_name in ["get_access_barrier", "get_access_state_name", "is_service_access_blocking", "process_tool_state", "get_contact_evaluation_count", "get_last_contact_name"]:
          		if not runtime.has_method(method_name):
          			await _fail("Scrapper runtime missing swing/access seam: %s" % method_name)
          			return

          	var barrier := runtime.call("get_access_barrier") as StaticBody3D
          	if barrier == null or String(runtime.call("get_access_state_name")) != "JAMMED" or not bool(runtime.call("is_service_access_blocking")):
          		await _fail("ServiceAlley access did not begin physically JAMMED")
          		return
          	if _scene.get_node_or_null("GearsDistrictSlice01B/ServiceAlley") == null or _scene.get_node_or_null("GearsDistrictSlice01B/NorthConnector") == null:
          		await _fail("Retained ServiceAlley/NorthConnector route seam is missing")
          		return

          	var pickup := runtime.call("get_pickup") as Node3D
          	if pickup == null:
          		await _fail("Scrapper pickup fixture is missing")
          		return
          	player.global_position = pickup.global_position + Vector3(0.4, 0.0, 0.0)
          	pickup.call("update_player_distance", player.global_position)
          	_scene.set("_active_target", pickup)
          	if not bool(runtime.call("acquire_active_pickup")):
          		await _fail("Could not acquire Scrapper for environment tracer")
          		return

          	var pivot := player.get_node_or_null("MeshPivot") as Node3D
          	if pivot == null:
          		await _fail("Player MeshPivot fixture is missing")
          		return
          	pivot.rotation.y = 0.0

          	# Out of range: one committed swing evaluates exactly once and misses.
          	player.global_position = barrier.global_position + Vector3(0.0, -0.7, 3.0)
          	if not bool(runtime.call("handle_tool_action_pressed")):
          		await _fail("Out-of-range committed swing was not accepted")
          		return
          	runtime.call("process_tool_state", 0.15)
          	if int(runtime.call("get_contact_evaluation_count")) != 1 or String(runtime.call("get_last_contact_name")) != "MISS":
          		await _fail("Out-of-range swing did not resolve exactly one miss")
          		return
          	if String(runtime.call("get_access_state_name")) != "JAMMED":
          		await _fail("Out-of-range swing forced the service access")
          		return
          	runtime.call("process_tool_state", 0.50)

          	# Behind the player's captured facing: still a miss.
          	player.global_position = barrier.global_position + Vector3(0.0, -0.7, -1.1)
          	pivot.rotation.y = 0.0
          	if not bool(runtime.call("handle_tool_action_pressed")):
          		await _fail("Directional miss swing was not accepted")
          		return
          	runtime.call("process_tool_state", 0.15)
          	if int(runtime.call("get_contact_evaluation_count")) != 2 or String(runtime.call("get_last_contact_name")) != "MISS":
          		await _fail("Behind-facing access incorrectly qualified")
          		return
          	runtime.call("process_tool_state", 0.50)

          	# In range and in front: force exactly one authored barrier open.
          	player.global_position = barrier.global_position + Vector3(0.0, -0.7, 1.15)
          	pivot.rotation.y = 0.0
          	var pre_mesh_position := (barrier.get_node("BarrierMesh") as Node3D).position
          	if not bool(runtime.call("handle_tool_action_pressed")):
          		await _fail("Valid access swing was not accepted")
          		return
          	runtime.call("process_tool_state", 0.15)
          	await physics_frame
          	if int(runtime.call("get_contact_evaluation_count")) != 3 or String(runtime.call("get_last_contact_name")) != "SERVICE_ACCESS":
          		await _fail("Valid swing did not select the authored service access exactly once")
          		return
          	if String(runtime.call("get_access_state_name")) != "FORCED_OPEN" or bool(runtime.call("is_service_access_blocking")):
          		await _fail("Valid Scrapper contact did not materially open ServiceAlley traversal")
          		return
          	if (barrier.get_node("BarrierMesh") as Node3D).position == pre_mesh_position:
          		await _fail("Forced access did not visibly move the jammed barrier")
          		return
          	runtime.call("process_tool_state", 0.50)

          	# Already-open access is not damageable; later swings evaluate once and miss it.
          	if not bool(runtime.call("handle_tool_action_pressed")):
          		await _fail("Post-open recovery did not permit another swing")
          		return
          	runtime.call("process_tool_state", 0.15)
          	if int(runtime.call("get_contact_evaluation_count")) != 4 or String(runtime.call("get_last_contact_name")) == "SERVICE_ACCESS":
          		await _fail("Already-open access accepted repeated damage/contact")
          		return

          	var incident := _scene.get_node_or_null("GearsWorkZoneIncident")
          	if incident == null or not incident.has_method("trigger_service_access_disruption"):
          		await _fail("Production 05 P04 service-access disruption seam is absent")
          		return

          	print("[GEARS_SCRAPPER_TOOL_ENVIRONMENT] PASS")
          	await _finish(0)
          EOF

      - name: Install Godot 4.7.1 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit

      - name: Require Task 3 environment progression RED only on P04 seam
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$("$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/gears_scrapper_tool_environment_test.gd 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 1
          grep -F "Production 05 P04 service-access disruption seam is absent" <<<"$output"

      - name: Run Task 2 and retained P01-P04 regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in gears_scrapper_tool_input_test.gd gears_work_zone_incident_test.gd gears_work_zone_mission_ordering_test.gd civic_repossession_pretriggered_suppression_test.gd civic_repossession_wanted_composition_test.gd field_hacking_report_suppression_test.gd wanted_heat1_scene_test.gd; do
            "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script "res://tests/$test"
          done

      - name: Commit tested Task 3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git add godot/scripts/player/runner.gd godot/scripts/world/gears_scrapper_tool_runtime.gd godot/tests/gears_scrapper_tool_environment_test.gd
          git restore --worktree -- .
          git clean -fdx
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only
          git config user.name "Johnny Maconny"
          git config user.email "58898456+JOHNNYMACONNY@users.noreply.github.com"
          git commit -m "build: produce Production 05 Task 3 candidate"
          git push origin HEAD:automation/p05-task3-build
