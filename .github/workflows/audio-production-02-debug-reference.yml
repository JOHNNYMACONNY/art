name: Audio Production 02 - Debug Reference Runtime Proof

on:
  pull_request:
    paths:
      - "code/audio_intake/audio_production_02_sources.json"
      - "code/audio_intake/audition_quarantine.py"
      - "code/audio_intake/prepare_debug_reference_pilot.py"
      - "godot/tests/audio02_debug_reference_resolver_test.gd"
      - "godot/scripts/audio/audio_reference_resolver.gd"
      - "godot/scripts/audio/audio_registry.gd"
      - "godot/scripts/audio/ui_audio_semantic_registry.gd"
      - ".github/workflows/audio-production-02-debug-reference.yml"
  push:
    branches: [main]
    paths:
      - "code/audio_intake/audio_production_02_sources.json"
      - "code/audio_intake/audition_quarantine.py"
      - "code/audio_intake/prepare_debug_reference_pilot.py"
      - "godot/tests/audio02_debug_reference_resolver_test.gd"
      - "godot/scripts/audio/audio_reference_resolver.gd"
      - "godot/scripts/audio/audio_registry.gd"
      - "godot/scripts/audio/ui_audio_semantic_registry.gd"
      - ".github/workflows/audio-production-02-debug-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
      GODOT_RELEASE: "4.7.1-stable"
      ECHOES_REFERENCE_AUDIO_MANIFEST: "${{ runner.temp }}/fb13-debug-reference/manifest.json"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact candidate revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Test intake safety
        run: python3 -m unittest discover -s code/audio_intake -p 'test_audio_*.py' -v
      - name: Install offline audio converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify pinned downloads and produce quarantined source material
        run: |
          python3 code/audio_intake/audition_quarantine.py \
            --catalog code/audio_intake/audio_production_02_sources.json \
            --output "$RUNNER_TEMP/fb13-audition-source"
      - name: Build local debug reference pilot (never under godot/)
        run: |
          python3 code/audio_intake/prepare_debug_reference_pilot.py \
            --quarantine "$RUNNER_TEMP/fb13-audition-source" \
            --output "$RUNNER_TEMP/fb13-debug-reference"
          test "$(python3 -c 'import json,os; p=os.environ["ECHOES_REFERENCE_AUDIO_MANIFEST"]; print(len(json.load(open(p))["slots"]))')" = "5"
      - name: Cache Godot 4.7.1 editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1
      - name: Download verified Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE/Godot_v$GODOT_RELEASE_linux.x86_64.zip"
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
      - name: Prime exact-head Godot debug project
        run: |
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit
      - name: Verify five recorded-debug streams, procedural fallback and fail-closed reset
        run: |
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot \
            --script res://tests/audio02_debug_reference_resolver_test.gd
      - name: Upload unapproved debugging evidence only
        uses: actions/upload-artifact@v4
        with:
          name: fb13-debug-reference-NOT-SHIPPING-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/fb13-debug-reference/
          retention-days: 14
          if-no-files-found: error
