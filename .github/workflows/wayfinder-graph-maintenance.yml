# Durable execution bridge for native Wayfinder issue relationships.
#
# When ChatGPT/Codex needs a sub-issue or blocked-by mutation that the direct
# GitHub connector does not expose, update .github/wayfinder-graph-request.json.
# Do not create a bespoke one-shot workflow for routine Wayfinder graph edits.
# This workflow is deliberately limited to issue relationships and verifies
# every requested delta after applying it.

name: Wayfinder Graph Maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/wayfinder-graph-request.json
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wayfinder-graph-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'JOHNNYMACONNY/art'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      API_VERSION: '2026-03-10'
      REQUEST_PATH: .github/wayfinder-graph-request.json
    steps:
      - name: Apply and verify requested graph operations
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "ERROR: $*" >&2
            exit 1
          }

          api() {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$@"
          }

          require_issue_number() {
            [[ "$1" =~ ^[1-9][0-9]*$ ]] || fail "invalid issue number: $1"
          }

          issue_id() {
            api "/repos/${REPO}/issues/$1" --jq '.id'
          }

          issue_parent() {
            api "/repos/${REPO}/issues/$1" --jq '.parent_issue_url // ""'
          }

          is_blocked_by() {
            local issue="$1"
            local blocker="$2"
            api "/repos/${REPO}/issues/${issue}/dependencies/blocked_by?per_page=100" \
              --jq "map(.number) | index(${blocker}) != null"
          }

          request_b64="$(api "/repos/${REPO}/contents/${REQUEST_PATH}?ref=${GITHUB_SHA}" --jq '.content')"
          request_json="$(printf '%s' "${request_b64}" | tr -d '\n' | base64 --decode)"

          jq -e '
            .schema_version == 1 and
            (.request_id | type == "string" and length > 0) and
            (.operations | type == "array")
          ' <<<"${request_json}" >/dev/null || fail 'invalid request schema'

          request_id="$(jq -r '.request_id' <<<"${request_json}")"
          op_count="$(jq '.operations | length' <<<"${request_json}")"
          echo "Wayfinder graph request: ${request_id} (${op_count} operation(s))"

          while IFS= read -r operation; do
            op="$(jq -r '.op // ""' <<<"${operation}")"

            case "${op}" in
              add_sub_issue)
                parent="$(jq -r '.parent' <<<"${operation}")"
                child="$(jq -r '.child' <<<"${operation}")"
                require_issue_number "${parent}"
                require_issue_number "${child}"

                desired="https://api.github.com/repos/${REPO}/issues/${parent}"
                current="$(issue_parent "${child}")"
                if [[ "${current}" == "${desired}" ]]; then
                  echo "#${child} already a child of #${parent}"
                elif [[ -n "${current}" ]]; then
                  fail "#${child} already has a different parent: ${current}"
                else
                  child_id="$(issue_id "${child}")"
                  api --method POST \
                    "/repos/${REPO}/issues/${parent}/sub_issues" \
                    -F "sub_issue_id=${child_id}" >/dev/null
                  echo "Added #${child} as child of #${parent}"
                fi

                [[ "$(issue_parent "${child}")" == "${desired}" ]] || \
                  fail "verification failed: #${child} is not a child of #${parent}"
                ;;

              remove_sub_issue)
                parent="$(jq -r '.parent' <<<"${operation}")"
                child="$(jq -r '.child' <<<"${operation}")"
                require_issue_number "${parent}"
                require_issue_number "${child}"

                desired="https://api.github.com/repos/${REPO}/issues/${parent}"
                current="$(issue_parent "${child}")"
                if [[ -z "${current}" ]]; then
                  echo "#${child} already has no parent"
                elif [[ "${current}" != "${desired}" ]]; then
                  fail "refusing to detach #${child} from unexpected parent: ${current}"
                else
                  child_id="$(issue_id "${child}")"
                  api --method DELETE \
                    "/repos/${REPO}/issues/${parent}/sub_issue" \
                    -F "sub_issue_id=${child_id}" >/dev/null
                  echo "Removed #${child} from #${parent}"
                fi

                [[ -z "$(issue_parent "${child}")" ]] || \
                  fail "verification failed: #${child} still has a parent"
                ;;

              add_blocked_by)
                issue="$(jq -r '.issue' <<<"${operation}")"
                blocker="$(jq -r '.blocker' <<<"${operation}")"
                require_issue_number "${issue}"
                require_issue_number "${blocker}"

                if [[ "$(is_blocked_by "${issue}" "${blocker}")" == 'true' ]]; then
                  echo "#${issue} already blocked by #${blocker}"
                else
                  blocker_id="$(issue_id "${blocker}")"
                  api --method POST \
                    "/repos/${REPO}/issues/${issue}/dependencies/blocked_by" \
                    -F "issue_id=${blocker_id}" >/dev/null
                  echo "Added dependency: #${issue} blocked by #${blocker}"
                fi

                [[ "$(is_blocked_by "${issue}" "${blocker}")" == 'true' ]] || \
                  fail "verification failed: #${issue} is not blocked by #${blocker}"
                ;;

              remove_blocked_by)
                issue="$(jq -r '.issue' <<<"${operation}")"
                blocker="$(jq -r '.blocker' <<<"${operation}")"
                require_issue_number "${issue}"
                require_issue_number "${blocker}"

                if [[ "$(is_blocked_by "${issue}" "${blocker}")" != 'true' ]]; then
                  echo "#${issue} is already not blocked by #${blocker}"
                else
                  blocker_id="$(issue_id "${blocker}")"
                  api --method DELETE \
                    "/repos/${REPO}/issues/${issue}/dependencies/blocked_by/${blocker_id}" >/dev/null
                  echo "Removed dependency: #${issue} blocked by #${blocker}"
                fi

                [[ "$(is_blocked_by "${issue}" "${blocker}")" != 'true' ]] || \
                  fail "verification failed: #${issue} is still blocked by #${blocker}"
                ;;

              *)
                fail "unsupported operation: ${op}"
                ;;
            esac
          done < <(jq -c '.operations[]' <<<"${request_json}")

          echo "Wayfinder graph request ${request_id} verified."
