name: Burnside Production 17

on:
  push:
    branches:
      - main
      - feat/production-17-sidearm-gunfire-consequence
    paths:
      - "contracts/burnside_production_17_sidearm_gunfire_consequence_spec.md"
      - ".github/workflows/burnside-production-17.yml"
      - "godot/scripts/input/touch_controls.gd"
      - "godot/scripts/input/gears_surveyed_route_touch_controls.gd"
      - "godot/scenes/prototype/scrap_test_block.tscn"
      - "godot/scripts/visual/gears_district_slice_01b.gd"
      - "godot/scripts/world/gears_sidearm_runtime.gd"
      - "godot/scripts/interactions/sidearm_pickup.gd"
      - "godot/scenes/interactions/sidearm_pickup.tscn"
      - "godot/scripts/world/gears_work_zone_incident.gd"
      - "godot/scripts/entities/utility_crawler.gd"
      - "godot/scripts/audio/audio_manager.gd"
      - "godot/tests/burnside_production17_sidearm_gunfire_test.gd"
      - "godot/tests/burnside_production17_sidearm_composition_test.gd"
      - "godot/tests/gears_scrapper_tool_input_test.gd"
      - "godot/tests/gears_scrapper_tool_input_lock_test.gd"
      - "godot/tests/player_survivability_integration_test.gd"
      - "godot/tests/burnside_checkpoint_courier_recognition_test.gd"
      - "godot/tests/burnside_mission03_memory_disclosure_test.gd"
  pull_request:
    paths:
      - "contracts/burnside_production_17_sidearm_gunfire_consequence_spec.md"
      - ".github/workflows/burnside-production-17.yml"
      - "godot/scripts/input/touch_controls.gd"
      - "godot/scripts/input/gears_surveyed_route_touch_controls.gd"
      - "godot/scenes/prototype/scrap_test_block.tscn"
      - "godot/scripts/visual/gears_district_slice_01b.gd"
      - "godot/scripts/world/gears_sidearm_runtime.gd"
      - "godot/scripts/interactions/sidearm_pickup.gd"
      - "godot/scenes/interactions/sidearm_pickup.tscn"
      - "godot/scripts/world/gears_work_zone_incident.gd"
      - "godot/scripts/entities/utility_crawler.gd"
      - "godot/scripts/audio/audio_manager.gd"
      - "godot/tests/burnside_production17_sidearm_gunfire_test.gd"
      - "godot/tests/burnside_production17_sidearm_composition_test.gd"
      - "godot/tests/gears_scrapper_tool_input_test.gd"
      - "godot/tests/gears_scrapper_tool_input_lock_test.gd"
      - "godot/tests/player_survivability_integration_test.gd"
      - "godot/tests/burnside_checkpoint_courier_recognition_test.gd"
      - "godot/tests/burnside_mission03_memory_disclosure_test.gd"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"

jobs:
  sidearm-gunfire:
    name: Exact-source P17 Sidearm Gunfire
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1

      - name: Install Godot 4.7.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"

      - name: Prime exact-source Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit
          test -s godot/.godot/global_script_class_cache.cfg

      - name: P17 sidearm gunfire tracer
        id: p17
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 180s "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/burnside_production17_sidearm_gunfire_test.gd

      - name: P17 sidearm composition / safety
        id: p17-composition
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 180s "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/burnside_production17_sidearm_composition_test.gd

      - name: Retained combat / input / consequence regressions
        shell: bash
        run: |
          set -euo pipefail
          for test_file in gears_scrapper_tool_input_test.gd gears_scrapper_tool_input_lock_test.gd player_survivability_integration_test.gd burnside_checkpoint_courier_recognition_test.gd burnside_mission03_memory_disclosure_test.gd; do
            echo "::group::$test_file"
            timeout --signal=TERM 180s "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script "res://tests/$test_file"
            echo "::endgroup::"
          done

      - name: Require P17 GREEN
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "p17=${{ steps.p17.outcome }}"
          echo "p17-composition=${{ steps.p17-composition.outcome }}"
          test "${{ steps.p17.outcome }}" = "success"
          test "${{ steps.p17-composition.outcome }}" = "success"
