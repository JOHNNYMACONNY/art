name: PR40 P2 RED

on:
  push:
    branches:
      - chatgpt/desktop-controls-29
    paths:
      - ".github/workflows/pr40-p2-red.yml"

permissions:
  contents: write

jobs:
  inject-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Add exact focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected marker once, found {count}")
              p.write_text(text.replace(old, new, 1))

          controls = "godot/tests/desktop_controls_event_routing_test.gd"
          replace_once(
              controls,
              '''\ttouch_ui.radio_toggle_pressed.connect(func(): radio_count[0] += 1)\n\n\ttouch_ui._input(_key_event(KEY_W, true))''',
              '''\ttouch_ui.radio_toggle_pressed.connect(func(): radio_count[0] += 1)\n\n\t# A focused touch Button must not receive the same Space key that driving\n\t# consumes as handbrake. Exercise the real Viewport propagation path.\n\ttouch_ui.radio_button.grab_focus()\n\tawait process_frame\n\tif not touch_ui.radio_button.has_focus():\n\t\tawait _fail("Radio button could not acquire focus for Space propagation proof")\n\t\treturn\n\troot.push_input(_key_event(KEY_SPACE, true), true)\n\troot.push_input(_key_event(KEY_SPACE, false), true)\n\tawait process_frame\n\tif radio_count[0] != 0:\n\t\tawait _fail("Vehicle Space leaked into focused RadioButton and toggled radio")\n\t\treturn\n\ttouch_ui.radio_button.release_focus()\n\n\ttouch_ui._input(_key_event(KEY_W, true))''',
          )

          interaction = "godot/tests/desktop_interaction_cancel_test.gd"
          replace_once(
              interaction,
              '''\t_mouse_motion(gesture_center + Vector2(10, 0), Vector2(10, 0))\n\tawait process_frame\n\t_mouse_up_at(gesture_center + Vector2(10, 0))''',
              '''\t_mouse_motion(gesture_center + Vector2(10, 0), Vector2(10, 0))\n\tawait process_frame\n\t# Releasing an unrelated mouse button while left remains the interaction\n\t# owner must not cancel the active tuner drag.\n\tvar unrelated_up := InputEventMouseButton.new()\n\tunrelated_up.device = 0\n\tunrelated_up.button_index = MOUSE_BUTTON_RIGHT\n\tunrelated_up.pressed = false\n\tunrelated_up.position = gesture_center + Vector2(10, 0)\n\troot.push_input(unrelated_up, true)\n\tawait process_frame\n\topen_error = _assert_tuner_open(touch_ui, player, tuner, camera)\n\tif not open_error.is_empty():\n\t\tawait _fail("Unrelated mouse-button release cancelled left-mouse tuner drag: %s" % open_error)\n\t\treturn\n\t_mouse_up_at(gesture_center + Vector2(10, 0))''',
          )
          PY

      - name: Commit tests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-automation"
          git config user.email "chatgpt-automation@users.noreply.github.com"
          git add godot/tests/desktop_controls_event_routing_test.gd godot/tests/desktop_interaction_cancel_test.gd
          printf '%s\n' godot/tests/desktop_controls_event_routing_test.gd godot/tests/desktop_interaction_cancel_test.gd | sort >/tmp/expected
          git diff --cached --name-only | sort >/tmp/actual
          diff -u /tmp/expected /tmp/actual
          git commit -m "test(29): reproduce focused input edge cases"
          git push origin HEAD:refs/heads/chatgpt/desktop-controls-29
