name: PR40 P2 RED

on:
  push:
    branches:
      - chatgpt/desktop-controls-29
    paths:
      - ".github/workflows/pr40-p2-red.yml"

permissions:
  contents: write

jobs:
  prove-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit

      - name: Prove both regressions RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/desktop_controls_event_routing_test.gd > /tmp/focused-button.log 2>&1
          rc_button=$?
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/desktop_interaction_cancel_test.gd > /tmp/mouse-release.log 2>&1
          rc_mouse=$?
          set -e

          cat /tmp/focused-button.log
          cat /tmp/mouse-release.log
          test "$rc_button" -ne 0
          test "$rc_mouse" -ne 0
          grep -F "Vehicle Space leaked into focused RadioButton and toggled radio" /tmp/focused-button.log
          grep -F "Unrelated mouse-button release cancelled left-mouse tuner drag" /tmp/mouse-release.log

          {
            echo "PR40_P2_RED_PROOF"
            echo "source_sha=$GITHUB_SHA"
            echo "focused_button_rc=$rc_button"
            echo "mouse_release_rc=$rc_mouse"
            grep -F "Vehicle Space leaked into focused RadioButton and toggled radio" /tmp/focused-button.log | head -1
            grep -F "Unrelated mouse-button release cancelled left-mouse tuner drag" /tmp/mouse-release.log | head -1
          } > godot/tests/.pr40-p2-red-evidence.txt

      - name: Commit RED evidence only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .godot-bin godot.zip
          git clean -fd -- godot ':!godot/tests/.pr40-p2-red-evidence.txt'
          git config user.name "chatgpt-automation"
          git config user.email "chatgpt-automation@users.noreply.github.com"
          git add godot/tests/.pr40-p2-red-evidence.txt
          test "$(git diff --cached --name-only)" = "godot/tests/.pr40-p2-red-evidence.txt"
          git commit -m "test(29): record focused P2 RED evidence"
          git push origin HEAD:refs/heads/chatgpt/desktop-controls-29
