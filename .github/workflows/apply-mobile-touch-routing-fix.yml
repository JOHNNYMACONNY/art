name: Apply Mobile Touch Routing Fix

on:
  push:
    branches:
      - chatgpt/mobile-touch-routing-fix
    paths:
      - ".github/workflows/apply-mobile-touch-routing-fix.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mobile-touch-routing-fix

      - name: Patch TouchControlsUI pointer routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("godot/scripts/input/touch_controls.gd")
          text = path.read_text()
          if "func _configure_pointer_routing() -> void:" in text:
              raise SystemExit("Pointer routing fix is already present")

          needle = "func _ready() -> void:\n\tif joystick_handle and joystick_base:\n"
          if needle not in text:
              raise SystemExit("Expected TouchControlsUI _ready() anchor not found")

          replacement = '''func _configure_pointer_routing() -> void:\n\t# Passive full-screen containers must bubble touch events to this root Control.\n\t# Interactive Button children keep their default STOP behavior.\n\tfor passive_control in [safe_area_root, left_touch_area, right_touch_area, driving_panel, gesture_panel, tension_panel, replay_panel]:\n\t\tif passive_control:\n\t\t\tpassive_control.mouse_filter = Control.MOUSE_FILTER_PASS\n\n\t# Joystick artwork appears directly under the active thumb; it must never\n\t# steal ScreenDrag/ScreenTouch events from the routing controls behind it.\n\tfor decorative_control in [joystick_base, joystick_handle, gesture_hint_label, alert_label, proximity_label]:\n\t\tif decorative_control:\n\t\t\tdecorative_control.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\nfunc _ready() -> void:\n\t_configure_pointer_routing()\n\tif joystick_handle and joystick_base:\n'''
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/scripts/input/touch_controls.gd
          git diff --cached --check
          git commit -m "fix(godot): let mobile touches reach joystick"
          git push origin HEAD:chatgpt/mobile-touch-routing-fix
