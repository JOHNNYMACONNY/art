name: Godot Web Playtest

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-playtest.yml"
  push:
    branches:
      - main
      - "chatgpt/**"
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-playtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-web:
    name: Export browser playtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
      WEB_PROJECT: "${{ github.workspace }}/.godot-web-project"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-4.7.1-linux-web-templates-v1

      - name: Install Godot 4.7.1 editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"

      - name: Install Godot 4.7.1 export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf "$template_dir"
          mkdir -p "$template_dir" "${RUNNER_TEMP}/godot-export-templates"
          unzip -q export_templates.tpz -d "${RUNNER_TEMP}/godot-export-templates"
          cp -R "${RUNNER_TEMP}/godot-export-templates/templates/." "$template_dir/"
          test -s "$template_dir/web_release.zip"

      - name: Verify Godot install
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_release.zip"

      - name: Prepare isolated WebGL compatibility project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WEB_PROJECT"
          cp -a godot "$WEB_PROJECT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["WEB_PROJECT"]) / "project.godot"
          text = project.read_text()
          expected = 'config/features=PackedStringArray("4.7", "Forward Plus")'
          if expected not in text:
              raise SystemExit("Expected Forward Plus project feature was not found; review web compatibility patch.")
          text = text.replace(
              expected,
              'config/features=PackedStringArray("4.7", "GL Compatibility")',
              1,
          )
          marker = "[rendering]\n"
          if marker not in text:
              raise SystemExit("[rendering] section not found")
          text = text.replace(
              marker,
              marker
              + 'renderer/rendering_method="gl_compatibility"\n'
              + 'renderer/rendering_method.mobile="gl_compatibility"\n'
              + 'textures/vram_compression/import_etc2_astc=true\n',
              1,
          )
          project.write_text(text)
          PY

          "$GODOT_BIN" \
            --headless \
            --editor \
            --rendering-method gl_compatibility \
            --path "$WEB_PROJECT" \
            --quit

      - name: Run mobile touch routing regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path "$WEB_PROJECT" \
            --script res://tests/touch_controls_event_routing_test.gd

      - name: Run desktop controls regression
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path "$WEB_PROJECT" \
            --script res://tests/desktop_controls_event_routing_test.gd

      - name: Export Web playtest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path "$WEB_PROJECT" \
            --export-release "Web Playtest" \
            "$GITHUB_WORKSPACE/build/web/index.html"

          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Static hosting smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory build/web >web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/index.html
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/index.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/index.wasm
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/index.pck

      - name: Upload browser playtest
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-playtest-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

  publish-playtest:
    name: Publish public playtest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: export-web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Web build
        uses: actions/download-artifact@v4
        with:
          name: godot-web-playtest-${{ github.sha }}
          path: publish

      - name: Stamp source revision
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > publish/PLAYTEST_BUILD.txt

      - name: Publish playtest-web branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publish
          git init -b playtest-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Godot playtest ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/playtest-web