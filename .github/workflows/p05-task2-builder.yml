name: P05 Task 2 Builder

on:
  push:
    branches:
      - "automation/p05-task2-build"
    paths:
      - ".github/workflows/p05-task2-builder.yml"

permissions:
  contents: write

jobs:
  build-task2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch Task 2 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          touch = "godot/scripts/input/touch_controls.gd"
          replace_once(touch, "signal action_button_pressed\n", "signal action_button_pressed\nsignal tool_action_pressed\n")
          replace_once(touch, '@onready var action_button: Button = _find_node_recursive("ActionButton")\n', '@onready var action_button: Button = _find_node_recursive("ActionButton")\n@onready var tool_action_button: Button = _find_node_recursive("ToolActionButton")\n')
          replace_once(touch, "var current_mode: UIMode = UIMode.FOOT_TRAVERSAL\n", "var current_mode: UIMode = UIMode.FOOT_TRAVERSAL\nvar _tool_action_available: bool = false\n")
          replace_once(touch, "func _on_dismount_button_clicked() -> void:\n", "func _on_tool_action_button_clicked() -> void:\n\tif current_mode == UIMode.FOOT_TRAVERSAL and _tool_action_available:\n\t\ttool_action_pressed.emit()\n\nfunc _on_dismount_button_clicked() -> void:\n")
          replace_once(touch, "func trigger_action() -> void:\n\t_on_action_button_clicked()\n", "func trigger_action() -> void:\n\t_on_action_button_clicked()\n\nfunc trigger_tool_action() -> void:\n\t_on_tool_action_button_clicked()\n\nfunc set_tool_action_available(available: bool) -> void:\n\t_tool_action_available = available\n\tif tool_action_button:\n\t\ttool_action_button.disabled = not available\n\t\ttool_action_button.visible = available and current_mode == UIMode.FOOT_TRAVERSAL\n")
          replace_once(touch, "\tif action_button:\n\t\taction_button.pressed.connect(_on_action_button_clicked)\n", "\tif action_button:\n\t\taction_button.pressed.connect(_on_action_button_clicked)\n\tif tool_action_button:\n\t\ttool_action_button.pressed.connect(_on_tool_action_button_clicked)\n")
          replace_once(touch, "\tset_route_switch_button_visible(false)\n\tupdate_radio_button_state(true)\n", "\tset_route_switch_button_visible(false)\n\tset_tool_action_available(false)\n\tupdate_radio_button_state(true)\n")
          replace_once(touch, "\tif mode == UIMode.FOOT_TRAVERSAL:\n\t\tif action_button: action_button.visible = true\n\t\tif driving_panel: driving_panel.visible = false\n\telif mode == UIMode.VEHICLE_DRIVING:\n\t\tif action_button: action_button.visible = false\n\t\tif driving_panel: driving_panel.visible = true\n", "\tif mode == UIMode.FOOT_TRAVERSAL:\n\t\tif action_button: action_button.visible = true\n\t\tif tool_action_button: tool_action_button.visible = _tool_action_available\n\t\tif driving_panel: driving_panel.visible = false\n\telif mode == UIMode.VEHICLE_DRIVING:\n\t\tif action_button: action_button.visible = false\n\t\tif tool_action_button: tool_action_button.visible = false\n\t\tif driving_panel: driving_panel.visible = true\n")
          replace_once(touch, "\t\t\telif _is_key(key_ev, KEY_SPACE) and current_mode == UIMode.FOOT_TRAVERSAL:\n", "\t\t\telif _is_key(key_ev, KEY_F) and current_mode == UIMode.FOOT_TRAVERSAL:\n\t\t\t\tif _tool_action_available:\n\t\t\t\t\ttool_action_pressed.emit()\n\t\t\telif _is_key(key_ev, KEY_SPACE) and current_mode == UIMode.FOOT_TRAVERSAL:\n")

          scene = "godot/scenes/prototype/scrap_test_block.tscn"
          tool_node = '''[node name="ToolActionButton" type="Button" parent="CanvasLayer/TouchControlsUI/SafeAreaRoot/RightTouchArea"]
          visible = false
          layout_mode = 1
          anchors_preset = 3
          anchor_left = 1.0
          anchor_top = 1.0
          anchor_right = 1.0
          anchor_bottom = 1.0
          offset_left = -304.0
          offset_top = -132.0
          offset_right = -172.0
          offset_bottom = -24.0
          grow_horizontal = 0
          grow_vertical = 0
          text = "[F] TOOL"

          '''.replace("          ", "")
          replace_once(scene, '[node name="DrivingOverlayPanel" type="Control" parent="CanvasLayer/TouchControlsUI/SafeAreaRoot"]\n', tool_node + '[node name="DrivingOverlayPanel" type="Control" parent="CanvasLayer/TouchControlsUI/SafeAreaRoot"]\n')

          district = "godot/scripts/visual/gears_district_slice_01b.gd"
          replace_once(district, 'const GearsWorkZoneIncidentScript = preload("res://scripts/world/gears_work_zone_incident.gd")\n', 'const GearsWorkZoneIncidentScript = preload("res://scripts/world/gears_work_zone_incident.gd")\nconst GearsScrapperToolRuntimeScript = preload("res://scripts/world/gears_scrapper_tool_runtime.gd")\n')
          replace_once(district, '\tcall_deferred("_mount_production_04_work_zone")\n', '\tcall_deferred("_mount_production_04_work_zone")\n\tcall_deferred("_mount_production_05_scrapper_tool")\n')
          mount = '''func _mount_production_05_scrapper_tool() -> void:
          \tvar scene_root := get_parent()
          \tif scene_root == null or not (scene_root is Node3D):
          \t\treturn
          \tif scene_root.get_node_or_null("GearsScrapperToolRuntime") != null:
          \t\treturn
          \tvar runtime := GearsScrapperToolRuntimeScript.new() as Node3D
          \tif runtime == null:
          \t\treturn
          \truntime.name = "GearsScrapperToolRuntime"
          \tscene_root.add_child(runtime)
          \tif not bool(runtime.call("configure", scene_root, self)):
          \t\truntime.queue_free()

          '''.replace("          ", "")
          replace_once(district, 'func _box_shape(node_path: String) -> BoxShape3D:\n', mount + 'func _box_shape(node_path: String) -> BoxShape3D:\n')
          PY

          cat > godot/scripts/interactions/scrapper_tool_pickup.gd <<'EOF'
          class_name ScrapperToolPickup
          extends InteractableBase

          var _acquired: bool = false

          func acquire() -> bool:
          	if _acquired:
          		return false
          	_acquired = true
          	is_powered = false
          	is_player_in_range = false
          	visible = false
          	monitoring = false
          	return true

          func reset_pickup() -> void:
          	_acquired = false
          	is_powered = true
          	visible = true
          	monitoring = true

          func is_acquired() -> bool:
          	return _acquired
          EOF

          cat > godot/scenes/interactions/scrapper_tool_pickup.tscn <<'EOF'
          [gd_scene load_steps=4 format=3]

          [ext_resource type="Script" path="res://scripts/interactions/scrapper_tool_pickup.gd" id="1_pickup"]

          [sub_resource type="BoxMesh" id="BoxMesh_tool"]
          size = Vector3(0.16, 0.16, 0.95)

          [sub_resource type="BoxShape3D" id="BoxShape_tool"]
          size = Vector3(0.22, 0.22, 1.05)

          [node name="ScrapperToolPickup" type="Area3D"]
          script = ExtResource("1_pickup")
          interaction_radius = 2.2
          interaction_priority = 1.4

          [node name="ToolMesh" type="MeshInstance3D" parent="."]
          rotation = Vector3(0.0, 0.0, 0.35)
          mesh = SubResource("BoxMesh_tool")

          [node name="CollisionShape3D" type="CollisionShape3D" parent="."]
          shape = SubResource("BoxShape_tool")
          EOF

          cat > godot/scripts/world/gears_scrapper_tool_runtime.gd <<'EOF'
          class_name GearsScrapperToolRuntime
          extends Node3D

          const ScrapperToolPickupScene = preload("res://scenes/interactions/scrapper_tool_pickup.tscn")

          var _root_controller: Node = null
          var _district: Node3D = null
          var _touch_ui: Node = null
          var _player: Node3D = null
          var _pickup: ScrapperToolPickup = null
          var _held_visual: MeshInstance3D = null
          var _held: bool = false
          var _configured: bool = false

          func configure(root_controller: Node, district: Node3D) -> bool:
          	if root_controller == null or district == null:
          		return false
          	var touch_ui := root_controller.get_node_or_null("CanvasLayer/TouchControlsUI")
          	var player := root_controller.get_node_or_null("Runner") as Node3D
          	var socket := district.get_node_or_null("ServiceAlleyEntrySocket") as Marker3D
          	if touch_ui == null or player == null or socket == null:
          		return false
          	if not touch_ui.has_signal("action_button_pressed") or not touch_ui.has_signal("tool_action_pressed") or not touch_ui.has_signal("replay_pressed"):
          		return false

          	_root_controller = root_controller
          	_district = district
          	_touch_ui = touch_ui
          	_player = player

          	_pickup = ScrapperToolPickupScene.instantiate() as ScrapperToolPickup
          	if _pickup == null:
          		return false
          	_pickup.name = "ScrapperToolPickup"
          	_root_controller.add_child(_pickup)
          	_pickup.global_position = socket.global_position + Vector3(1.15, 0.55, 0.95)

          	var interactables = _root_controller.get("_interactables")
          	if interactables is Array and not interactables.has(_pickup):
          		interactables.append(_pickup)

          	_ensure_held_visual()
          	_touch_ui.call("set_tool_action_available", false)

          	var action_callable := Callable(self, "_on_action_pressed")
          	if not _touch_ui.is_connected("action_button_pressed", action_callable):
          		_touch_ui.connect("action_button_pressed", action_callable)
          	var tool_callable := Callable(self, "handle_tool_action_pressed")
          	if not _touch_ui.is_connected("tool_action_pressed", tool_callable):
          		_touch_ui.connect("tool_action_pressed", tool_callable)
          	var replay_callable := Callable(self, "reset_runtime")
          	if not _touch_ui.is_connected("replay_pressed", replay_callable):
          		_touch_ui.connect("replay_pressed", replay_callable)

          	_configured = true
          	return true

          func _ensure_held_visual() -> void:
          	if _held_visual != null or _player == null:
          		return
          	var mesh := BoxMesh.new()
          	mesh.size = Vector3(0.12, 0.12, 0.82)
          	_held_visual = MeshInstance3D.new()
          	_held_visual.name = "HeldScrapperTool"
          	_held_visual.mesh = mesh
          	_held_visual.position = Vector3(0.34, 0.58, -0.38)
          	_held_visual.rotation = Vector3(0.15, 0.0, 0.55)
          	_held_visual.visible = false
          	_player.add_child(_held_visual)

          func _on_action_pressed() -> void:
          	acquire_active_pickup()

          func handle_action_pressed() -> bool:
          	return acquire_active_pickup()

          func acquire_active_pickup() -> bool:
          	if not _configured or _held or _pickup == null or not is_instance_valid(_pickup):
          		return false
          	if _root_controller.get("_active_target") != _pickup:
          		return false
          	var actor := _player
          	if actor == null:
          		return false
          	_pickup.update_player_distance(actor.global_position)
          	if not _pickup.can_interact(actor.global_position):
          		return false
          	if not _pickup.acquire():
          		return false
          	_held = true
          	if _held_visual:
          		_held_visual.visible = true
          	_touch_ui.call("set_tool_action_available", true)
          	return true

          func handle_tool_action_pressed() -> bool:
          	if not _configured or not _held or _touch_ui == null:
          		return false
          	if int(_touch_ui.get("current_mode")) != int(TouchControlsUI.UIMode.FOOT_TRAVERSAL):
          		return false
          	# Swing behavior begins in Task 3. This seam intentionally does not call Action.
          	return false

          func has_tool() -> bool:
          	return _held

          func get_pickup() -> ScrapperToolPickup:
          	return _pickup

          func reset_runtime() -> void:
          	_held = false
          	if _pickup != null and is_instance_valid(_pickup):
          		_pickup.reset_pickup()
          	if _held_visual != null and is_instance_valid(_held_visual):
          		_held_visual.visible = false
          	if _touch_ui != null and is_instance_valid(_touch_ui):
          		_touch_ui.call("set_tool_action_available", false)
          EOF

          cat > godot/tests/gears_scrapper_tool_input_test.gd <<'EOF'
          extends SceneTree

          var _scene: Node = null
          var _runtime: Node = null

          func _init() -> void:
          	call_deferred("_run")

          func _finish(code: int) -> void:
          	if is_instance_valid(_scene):
          		_scene.queue_free()
          		await process_frame
          		await process_frame
          	if _runtime != null:
          		_runtime.call("reset_runtime")
          	quit(code)

          func _fail(message: String) -> void:
          	push_error("[GEARS_SCRAPPER_TOOL_INPUT] %s" % message)
          	await _finish(1)

          func _run() -> void:
          	_runtime = root.get_node_or_null("BurnsideWantedRuntime")
          	if _runtime == null:
          		await _fail("BurnsideWantedRuntime autoload is missing")
          		return
          	var packed := load("res://scenes/prototype/scrap_test_block.tscn") as PackedScene
          	if packed == null:
          		await _fail("Production scene could not load")
          		return
          	_scene = packed.instantiate()
          	root.add_child(_scene)
          	await process_frame
          	await physics_frame
          	await process_frame
          	await process_frame
          	if not bool(_runtime.call("bind_to_scene", _scene)):
          		await _fail("Wanted runtime did not bind to production scene")
          		return

          	var touch_ui := _scene.get_node_or_null("CanvasLayer/TouchControlsUI")
          	var player := _scene.get_node_or_null("Runner") as Node3D
          	var scrapper := _scene.get_node_or_null("GearsScrapperToolRuntime")
          	if touch_ui == null or player == null:
          		await _fail("Retained input/player fixture is missing")
          		return
          	if not touch_ui.has_signal("tool_action_pressed"):
          		await _fail("Production 05 dedicated Tool Action is absent")
          		return
          	var tool_button := touch_ui.get_node_or_null("SafeAreaRoot/RightTouchArea/ToolActionButton") as Button
          	if tool_button == null:
          		await _fail("Tool Action touch button is absent")
          		return
          	if scrapper == null:
          		await _fail("Production 05 Scrapper runtime is absent")
          		return
          	if bool(scrapper.call("has_tool")):
          		await _fail("Scrapper Tool started already held")
          		return

          	var pickup := scrapper.call("get_pickup") as Node3D
          	if pickup == null:
          		await _fail("Scrapper Tool pickup was not mounted")
          		return
          	player.global_position = pickup.global_position + Vector3(0.4, 0.0, 0.0)
          	pickup.call("update_player_distance", player.global_position)
          	_scene.set("_active_target", pickup)
          	if not bool(scrapper.call("acquire_active_pickup")) or not bool(scrapper.call("has_tool")):
          		await _fail("Contextual Scrapper Tool pickup did not acquire")
          		return
          	if not tool_button.visible or tool_button.disabled:
          		await _fail("Held Scrapper Tool did not expose available Tool Action")
          		return

          	var counts := {"action": 0, "tool": 0}
          	touch_ui.action_button_pressed.connect(func(): counts.action += 1)
          	touch_ui.tool_action_pressed.connect(func(): counts.tool += 1)
          	touch_ui.call("trigger_tool_action")
          	await process_frame
          	if int(counts.tool) != 1 or int(counts.action) != 0:
          		await _fail("Tool press double-fired or synthesized generic Action")
          		return
          	if bool(touch_ui.call("is_pointer_index_claimed", 17)):
          		await _fail("Tool press leaked touch pointer ownership")
          		return

          	scrapper.call("reset_runtime")
          	player.global_position = pickup.global_position + Vector3(0.4, 0.0, 0.0)
          	pickup.call("update_player_distance", player.global_position)
          	_scene.set("_active_target", pickup)
          	touch_ui.call("trigger_action")
          	await process_frame
          	if not bool(scrapper.call("has_tool")):
          		await _fail("Pickup did not use retained contextual Action")
          		return
          	if int(counts.action) != 1 or int(counts.tool) != 1:
          		await _fail("Contextual pickup Action polluted Tool signal ownership")
          		return

          	touch_ui.call("set_mode", TouchControlsUI.UIMode.VEHICLE_DRIVING)
          	if tool_button.visible:
          		await _fail("Tool Action remained visible while mounted/driving")
          		return
          	touch_ui.call("trigger_tool_action")
          	await process_frame
          	if int(counts.tool) != 1:
          		await _fail("Vehicle mode accepted Tool Action")
          		return
          	touch_ui.call("set_mode", TouchControlsUI.UIMode.FOOT_TRAVERSAL)
          	if not tool_button.visible:
          		await _fail("Returning on foot did not restore held Tool Action availability")
          		return

          	touch_ui.replay_pressed.emit()
          	await process_frame
          	if bool(scrapper.call("has_tool")) or tool_button.visible or bool(pickup.call("is_acquired")):
          		await _fail("Replay did not restore Scrapper pickup/possession/UI state")
          		return

          	print("[GEARS_SCRAPPER_TOOL_INPUT] PASS")
          	await _finish(0)
          EOF

          rm .github/workflows/p05-task2-builder.yml

      - name: Install Godot 4.7.1 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit

      - name: Run Task 2 input tracer
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script res://tests/gears_scrapper_tool_input_test.gd

      - name: Run retained input compatibility
        run: |
          set -euo pipefail
          for test in \
            touch_controls_event_routing_test.gd \
            desktop_controls_event_routing_test.gd \
            desktop_control_alias_ownership_test.gd \
            desktop_vehicle_authority_test.gd \
            desktop_interaction_cancel_test.gd; do
            "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script "res://tests/$test"
          done

      - name: Run retained P01-P04 regressions
        run: |
          set -euo pipefail
          for test in \
            gears_work_zone_incident_test.gd \
            gears_work_zone_mission_ordering_test.gd \
            civic_repossession_pretriggered_suppression_test.gd \
            civic_repossession_wanted_composition_test.gd \
            field_hacking_report_suppression_test.gd \
            wanted_heat1_scene_test.gd; do
            "$GODOT_BIN" --headless --rendering-method gl_compatibility --path godot --script "res://tests/$test"
          done

      - name: Commit tested Task 2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "Johnny Maconny"
          git config user.email "58898456+JOHNNYMACONNY@users.noreply.github.com"
          git add -A
          git commit -m "build: produce Production 05 Task 2 candidate"
          git push origin HEAD:automation/p05-task2-build
