name: Camera 30 Canonical Test Repair

on:
  push:
    branches:
      - chatgpt/camera-feel-30
    paths:
      - .github/workflows/camera-30-canonical-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/camera-feel-30
          fetch-depth: 2
      - name: Verify guarded parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "54188fe3219a271a3e3e0ce07e9c74a62401f479"
      - name: Repair stale Ticket05 camera assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path('godot/scripts/prototype/scrap_test_block.gd')
          s = p.read_text()

          old_mount = '''\tassert(courier_bike.current_state == CourierBike.BikeState.MOUNTING, "FAIL: Bike must enter MOUNTING")
\tcamera.set_target(courier_bike)
\t
\tvar last_pos: Vector3 = camera.global_position
'''
          new_mount = '''\tassert(courier_bike.current_state == CourierBike.BikeState.MOUNTING, "FAIL: Bike must enter MOUNTING")
\t# Deterministic single-owner camera simulation: timers advance the vehicle
\t# lifecycle while this test alone advances Camera3D at the fixed dt below.
\tcamera.set_process(false)
\tcamera.set_target(courier_bike)
\t
\tvar last_pos: Vector3 = camera.global_position
'''
          if s.count(old_mount) != 1:
              raise SystemExit(f'mount anchor count={s.count(old_mount)}')
          s = s.replace(old_mount, new_mount, 1)

          old_dismount_tail = '''\t\tassert(current_pos.distance_to(last_pos) < 0.8, "FAIL: Camera position step during dismount")
\t\tlast_pos = current_pos

\tprint("[TICKET 05 TEST 2 PASSED] Mount/dismount focus continuity verified!")

\t# -------------------------------------------------------------------------
\t# TEST 3: Handbrake 180° Look-Ahead Reversal Damping
'''
          new_dismount_tail = '''\t\tassert(current_pos.distance_to(last_pos) < 0.8, "FAIL: Camera position step during dismount")
\t\tlast_pos = current_pos

\tcamera.set_process(true)
\tprint("[TICKET 05 TEST 2 PASSED] Mount/dismount focus continuity verified!")

\t# -------------------------------------------------------------------------
\t# TEST 3: Handbrake 180° Look-Ahead Reversal Damping
'''
          if s.count(old_dismount_tail) != 1:
              raise SystemExit(f'dismount anchor count={s.count(old_dismount_tail)}')
          s = s.replace(old_dismount_tail, new_dismount_tail, 1)

          old_yaw = '''\t# -------------------------------------------------------------------------
\t# TEST 4: Vehicle Yaw / Camera Orientation Decoupling
\t# -------------------------------------------------------------------------
\tprint("[TEST 4] Testing Vehicle Yaw Decoupling (Camera Basis Invariant)...")
\treset_slice()
\tawait get_tree().create_timer(0.1).timeout
\tcamera.reset_camera_instant(courier_bike)
\tvar initial_cam_basis: Basis = camera.global_transform.basis

\t# Rotate vehicle through 360° at high angular speed (powerslide donut)
\tcourier_bike.current_state = CourierBike.BikeState.DRIVING
\tcourier_bike.current_speed = 5.0
\tfor i in range(60):
\t\tcourier_bike.rotation.y += deg_to_rad(15.0) # 15 deg/frame * 60 = 900 deg
\t\tcourier_bike.velocity = -courier_bike.global_transform.basis.z * 5.0
\t\tcamera._process(dt)
\t\t
\t\t# Camera basis must NOT rotate with vehicle yaw!
\t\tvar current_cam_basis: Basis = camera.global_transform.basis
\t\tvar basis_diff_x: float = current_cam_basis.x.distance_to(initial_cam_basis.x)
\t\tvar basis_diff_y: float = current_cam_basis.y.distance_to(initial_cam_basis.y)
\t\tvar basis_diff_z: float = current_cam_basis.z.distance_to(initial_cam_basis.z)
\t\tassert(basis_diff_x < 0.005 and basis_diff_y < 0.005 and basis_diff_z < 0.005, "FAIL: Camera basis must remain fixed during vehicle spin/donut")

\tprint("[TICKET 05 TEST 4 PASSED] Vehicle yaw / camera orientation decoupling verified!")
'''
          new_yaw = '''\t# -------------------------------------------------------------------------
\t# TEST 4: Vehicle Heading Follow / Bounded Camera Yaw (#30)
\t# -------------------------------------------------------------------------
\tprint("[TEST 4] Testing bounded dynamic vehicle heading follow...")
\treset_slice()
\tawait get_tree().create_timer(0.1).timeout
\tcamera.reset_camera_instant(courier_bike)
\tvar initial_cam_yaw: float = camera._current_yaw_rad

\t# Hold a sustained 90° vehicle heading and verify the camera follows it
\t# through the configured slew cap rather than snapping or staying fixed.
\tcourier_bike.current_state = CourierBike.BikeState.DRIVING
\tcourier_bike.current_speed = 5.0
\tcourier_bike.rotation.y = deg_to_rad(90.0)
\tcourier_bike.velocity = -courier_bike.global_transform.basis.z * 5.0
\tvar previous_cam_yaw: float = camera._current_yaw_rad
\tfor i in range(90):
\t\tcamera._process(dt)
\t\tvar current_cam_yaw: float = camera._current_yaw_rad
\t\tvar yaw_step: float = abs(wrapf(current_cam_yaw - previous_cam_yaw, -PI, PI))
\t\tassert(yaw_step <= camera.max_yaw_speed * dt + 0.001, "FAIL: Dynamic camera yaw exceeded configured slew cap")
\t\tprevious_cam_yaw = current_cam_yaw

\tvar vehicle_forward: Vector3 = -courier_bike.global_transform.basis.z
\tvehicle_forward.y = 0.0
\tvehicle_forward = vehicle_forward.normalized()
\tvar expected_cam_yaw: float = wrapf(atan2(vehicle_forward.x, vehicle_forward.z) + PI, -PI, PI)
\tvar final_yaw_error: float = abs(wrapf(camera._current_yaw_rad - expected_cam_yaw, -PI, PI))
\tassert(abs(wrapf(camera._current_yaw_rad - initial_cam_yaw, -PI, PI)) > 0.2, "FAIL: Camera yaw stayed fixed instead of following vehicle heading")
\tassert(final_yaw_error < 0.35, "FAIL: Camera yaw did not converge to sustained vehicle heading")

\tprint("[TICKET 05 TEST 4 PASSED] Bounded dynamic vehicle heading follow verified!")
'''
          if s.count(old_yaw) != 1:
              raise SystemExit(f'yaw block count={s.count(old_yaw)}')
          s = s.replace(old_yaw, new_yaw, 1)
          s = s.replace('Testing Single-Layer Smooth Focus, Look-Ahead, FOV Breathing, Decoupled Yaw', 'Testing Single-Layer Smooth Focus, Look-Ahead, FOV Breathing, Bounded Dynamic Yaw', 1)
          p.write_text(s)
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/camera-30-canonical-repair.yml
          git add godot/scripts/prototype/scrap_test_block.gd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(camera): align Ticket05 with dynamic heading follow"
          git push origin HEAD:chatgpt/camera-feel-30
