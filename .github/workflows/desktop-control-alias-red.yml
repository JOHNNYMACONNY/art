name: Desktop Control Alias Regression

on:
  push:
    branches:
      - chatgpt/desktop-controls-29
    paths:
      - "godot/tests/desktop_control_alias_ownership_test.gd"
      - "godot/scripts/input/touch_controls.gd"
      - ".github/workflows/desktop-control-alias-red.yml"

permissions:
  contents: read
  issues: write

jobs:
  alias-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Godot 4.7.1 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"

      - name: Prime Godot metadata
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --rendering-method gl_compatibility --path godot --quit

      - name: Run desktop alias ownership regression
        id: alias_test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" \
            --headless \
            --rendering-method gl_compatibility \
            --path godot \
            --script res://tests/desktop_control_alias_ownership_test.gd

      - name: Record intentional RED evidence
        if: steps.alias_test.outcome == 'failure'
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/40/comments" \
            -f body="TDD RED — desktop alias ownership regression failed on exact head ${GITHUB_SHA} before production fix. Releasing one alias cancels a still-held W/Up or D/Right alias."

      - name: Preserve regression failure
        if: steps.alias_test.outcome == 'failure'
        run: exit 1
