name: Repair PR40 Review Findings

on:
  push:
    branches:
      - chatgpt/desktop-controls-29
    paths:
      - ".github/workflows/repair-pr40-review.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_RELEASE: "4.7.1-stable"
      GODOT_BIN: "${{ github.workspace }}/.godot-bin/Godot_v4.7.1-stable_linux.x86_64"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/desktop-controls-29
          fetch-depth: 1

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.1-linux-editor-v1

      - name: Install Godot 4.7.1 editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip" | sha256sum --check --strict
          mkdir -p .godot-bin
          unzip -q godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"

      - name: TDD repair exact review findings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          desktop = Path("godot/tests/desktop_controls_event_routing_test.gd")
          text = desktop.read_text()
          needle = '''\ttouch_ui.radio_toggle_pressed.connect(func(): radio_count[0] += 1)\n\n\ttouch_ui._input(_key_event(KEY_W, true))\n'''
          replacement = '''\ttouch_ui.radio_toggle_pressed.connect(func(): radio_count[0] += 1)\n\n\t# Equivalent keyboard aliases must be tracked independently. Releasing one\n\t# alias cannot clear a direction while its companion key remains held.\n\ttouch_ui._input(_key_event(KEY_W, true))\n\ttouch_ui._input(_key_event(KEY_UP, true))\n\ttouch_ui._input(_key_event(KEY_W, false))\n\tif not is_equal_approx(throttle[0], 1.0):\n\t\tawait _fail("Vehicle forward alias release cleared still-held Up alias")\n\t\treturn\n\ttouch_ui._input(_key_event(KEY_UP, false))\n\tif not is_equal_approx(throttle[0], 0.0):\n\t\tawait _fail("Vehicle forward aliases did not clear after both releases")\n\t\treturn\n\n\ttouch_ui._input(_key_event(KEY_S, true))\n\ttouch_ui._input(_key_event(KEY_DOWN, true))\n\ttouch_ui._input(_key_event(KEY_S, false))\n\tif not is_equal_approx(throttle[0], -1.0):\n\t\tawait _fail("Vehicle reverse alias release cleared still-held Down alias")\n\t\treturn\n\ttouch_ui._input(_key_event(KEY_DOWN, false))\n\tif not is_equal_approx(throttle[0], 0.0):\n\t\tawait _fail("Vehicle reverse aliases did not clear after both releases")\n\t\treturn\n\n\ttouch_ui._input(_key_event(KEY_D, true))\n\ttouch_ui._input(_key_event(KEY_RIGHT, true))\n\ttouch_ui._input(_key_event(KEY_D, false))\n\tif not is_equal_approx(steer[0], 1.0):\n\t\tawait _fail("Vehicle right alias release cleared still-held Right arrow")\n\t\treturn\n\ttouch_ui._input(_key_event(KEY_RIGHT, false))\n\tif not is_equal_approx(steer[0], 0.0):\n\t\tawait _fail("Vehicle right aliases did not clear after both releases")\n\t\treturn\n\n\ttouch_ui._input(_key_event(KEY_A, true))\n\ttouch_ui._input(_key_event(KEY_LEFT, true))\n\ttouch_ui._input(_key_event(KEY_A, false))\n\tif not is_equal_approx(steer[0], -1.0):\n\t\tawait _fail("Vehicle left alias release cleared still-held Left arrow")\n\t\treturn\n\ttouch_ui._input(_key_event(KEY_LEFT, false))\n\tif not is_equal_approx(steer[0], 0.0):\n\t\tawait _fail("Vehicle left aliases did not clear after both releases")\n\t\treturn\n\n\ttouch_ui._input(_key_event(KEY_W, true))\n'''
          if text.count(needle) != 1:
              raise SystemExit("desktop test insertion seam changed")
          desktop.write_text(text.replace(needle, replacement, 1))

          ci_dir = Path("scripts/ci")
          ci_dir.mkdir(parents=True, exist_ok=True)
          Path("scripts/ci/test_godot_failure_signature.py").write_text(r'''from pathlib import Path
          from tempfile import TemporaryDirectory
          from godot_failure_signature import equivalent_failure_signatures

          def write(root: Path, name: str, text: str) -> Path:
              path = root / name
              path.write_text(text)
              return path

          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              same_head = write(root, "same-head.log", "noise\nERROR: Assertion failed: speed invariant\n")
              same_base = write(root, "same-base.log", "different noise\nERROR:   Assertion failed: speed invariant\n")
              assert equivalent_failure_signatures(same_head, same_base)

              added_head = write(root, "added-head.log", "ERROR: Assertion failed: speed invariant\nERROR: FAIL new steering invariant\n")
              assert not equivalent_failure_signatures(added_head, same_base)

              different_base = write(root, "different-base.log", "ERROR: Assertion failed: unrelated baseline failure\n")
              assert not equivalent_failure_signatures(same_head, different_base)

              empty_head = write(root, "empty-head.log", "process exited 1 with no diagnostic\n")
              empty_base = write(root, "empty-base.log", "process exited 1 with no diagnostic\n")
              assert not equivalent_failure_signatures(empty_head, empty_base)

              ansi_head = write(root, "ansi-head.log", "\x1b[31mSCRIPT ERROR: FAIL camera contract\x1b[0m\n")
              ansi_base = write(root, "ansi-base.log", "SCRIPT ERROR: FAIL camera contract\n")
              assert equivalent_failure_signatures(ansi_head, ansi_base)

          print("[GODOT_FAILURE_SIGNATURE_TEST] PASS")
          ''')
          PY

          "$GODOT_BIN" --headless --editor --path godot --quit
          test -s godot/.godot/global_script_class_cache.cfg

          set +e
          "$GODOT_BIN" --headless --path godot --script res://tests/desktop_controls_event_routing_test.gd > /tmp/alias-red.log 2>&1
          alias_red=$?
          python3 scripts/ci/test_godot_failure_signature.py > /tmp/classifier-red.log 2>&1
          classifier_red=$?
          set -e

          cat /tmp/alias-red.log
          cat /tmp/classifier-red.log
          test "$alias_red" -ne 0
          grep -F "Vehicle forward alias release cleared still-held Up alias" /tmp/alias-red.log
          test "$classifier_red" -ne 0
          grep -E "ModuleNotFoundError|No module named" /tmp/classifier-red.log
          echo "RED confirmed for alias ownership and missing failure-signature classifier."

          python3 - <<'PY'
          from pathlib import Path

          touch = Path("godot/scripts/input/touch_controls.gd")
          text = touch.read_text()

          old_decl = '''var _keyboard_forward_pressed: bool = false\nvar _keyboard_reverse_pressed: bool = false\nvar _keyboard_left_pressed: bool = false\nvar _keyboard_right_pressed: bool = false\nvar _keyboard_handbrake_pressed: bool = false\n'''
          new_decl = '''var _keyboard_forward_pressed: bool = false\nvar _keyboard_reverse_pressed: bool = false\nvar _keyboard_left_pressed: bool = false\nvar _keyboard_right_pressed: bool = false\nvar _keyboard_handbrake_pressed: bool = false\nvar _keyboard_w_pressed: bool = false\nvar _keyboard_up_pressed: bool = false\nvar _keyboard_s_pressed: bool = false\nvar _keyboard_down_pressed: bool = false\nvar _keyboard_a_pressed: bool = false\nvar _keyboard_left_arrow_pressed: bool = false\nvar _keyboard_d_pressed: bool = false\nvar _keyboard_right_arrow_pressed: bool = false\n'''
          if text.count(old_decl) != 1:
              raise SystemExit("keyboard declaration seam changed")
          text = text.replace(old_decl, new_decl, 1)

          old_reset_sync = '''func _reset_keyboard_driving_inputs() -> void:\n\t_keyboard_forward_pressed = false\n\t_keyboard_reverse_pressed = false\n\t_keyboard_left_pressed = false\n\t_keyboard_right_pressed = false\n\t_keyboard_handbrake_pressed = false\n\nfunc _sync_keyboard_driving_inputs_from_input() -> void:\n\t_keyboard_forward_pressed = Input.is_physical_key_pressed(KEY_W) or Input.is_key_pressed(KEY_W) or Input.is_physical_key_pressed(KEY_UP) or Input.is_key_pressed(KEY_UP)\n\t_keyboard_reverse_pressed = Input.is_physical_key_pressed(KEY_S) or Input.is_key_pressed(KEY_S) or Input.is_physical_key_pressed(KEY_DOWN) or Input.is_key_pressed(KEY_DOWN)\n\t_keyboard_left_pressed = Input.is_physical_key_pressed(KEY_A) or Input.is_key_pressed(KEY_A) or Input.is_physical_key_pressed(KEY_LEFT) or Input.is_key_pressed(KEY_LEFT)\n\t_keyboard_right_pressed = Input.is_physical_key_pressed(KEY_D) or Input.is_key_pressed(KEY_D) or Input.is_physical_key_pressed(KEY_RIGHT) or Input.is_key_pressed(KEY_RIGHT)\n\t_keyboard_handbrake_pressed = Input.is_physical_key_pressed(KEY_SPACE) or Input.is_key_pressed(KEY_SPACE)\n'''
          new_reset_sync = '''func _refresh_keyboard_direction_state() -> void:\n\t_keyboard_forward_pressed = _keyboard_w_pressed or _keyboard_up_pressed\n\t_keyboard_reverse_pressed = _keyboard_s_pressed or _keyboard_down_pressed\n\t_keyboard_left_pressed = _keyboard_a_pressed or _keyboard_left_arrow_pressed\n\t_keyboard_right_pressed = _keyboard_d_pressed or _keyboard_right_arrow_pressed\n\nfunc _reset_keyboard_driving_inputs() -> void:\n\t_keyboard_w_pressed = false\n\t_keyboard_up_pressed = false\n\t_keyboard_s_pressed = false\n\t_keyboard_down_pressed = false\n\t_keyboard_a_pressed = false\n\t_keyboard_left_arrow_pressed = false\n\t_keyboard_d_pressed = false\n\t_keyboard_right_arrow_pressed = false\n\t_keyboard_handbrake_pressed = false\n\t_refresh_keyboard_direction_state()\n\nfunc _sync_keyboard_driving_inputs_from_input() -> void:\n\t_keyboard_w_pressed = Input.is_physical_key_pressed(KEY_W) or Input.is_key_pressed(KEY_W)\n\t_keyboard_up_pressed = Input.is_physical_key_pressed(KEY_UP) or Input.is_key_pressed(KEY_UP)\n\t_keyboard_s_pressed = Input.is_physical_key_pressed(KEY_S) or Input.is_key_pressed(KEY_S)\n\t_keyboard_down_pressed = Input.is_physical_key_pressed(KEY_DOWN) or Input.is_key_pressed(KEY_DOWN)\n\t_keyboard_a_pressed = Input.is_physical_key_pressed(KEY_A) or Input.is_key_pressed(KEY_A)\n\t_keyboard_left_arrow_pressed = Input.is_physical_key_pressed(KEY_LEFT) or Input.is_key_pressed(KEY_LEFT)\n\t_keyboard_d_pressed = Input.is_physical_key_pressed(KEY_D) or Input.is_key_pressed(KEY_D)\n\t_keyboard_right_arrow_pressed = Input.is_physical_key_pressed(KEY_RIGHT) or Input.is_key_pressed(KEY_RIGHT)\n\t_keyboard_handbrake_pressed = Input.is_physical_key_pressed(KEY_SPACE) or Input.is_key_pressed(KEY_SPACE)\n\t_refresh_keyboard_direction_state()\n'''
          if text.count(old_reset_sync) != 1:
              raise SystemExit("keyboard reset/sync seam changed")
          text = text.replace(old_reset_sync, new_reset_sync, 1)

          old_update = '''func _update_keyboard_vehicle_state(event: InputEventKey) -> bool:\n\tif current_mode != UIMode.VEHICLE_DRIVING or event.echo:\n\t\treturn false\n\tif _is_key(event, KEY_W, KEY_UP):\n\t\t_keyboard_forward_pressed = event.pressed\n\t\t_emit_net_throttle()\n\t\treturn true\n\tif _is_key(event, KEY_S, KEY_DOWN):\n\t\t_keyboard_reverse_pressed = event.pressed\n\t\t_emit_net_throttle()\n\t\treturn true\n\tif _is_key(event, KEY_A, KEY_LEFT):\n\t\t_keyboard_left_pressed = event.pressed\n\t\t_emit_net_steer()\n\t\treturn true\n\tif _is_key(event, KEY_D, KEY_RIGHT):\n\t\t_keyboard_right_pressed = event.pressed\n\t\t_emit_net_steer()\n\t\treturn true\n\tif _is_key(event, KEY_SPACE):\n\t\t_keyboard_handbrake_pressed = event.pressed\n\t\t_emit_net_handbrake()\n\t\treturn true\n\treturn false\n'''
          new_update = '''func _update_keyboard_vehicle_state(event: InputEventKey) -> bool:\n\tif current_mode != UIMode.VEHICLE_DRIVING or event.echo:\n\t\treturn false\n\tif _is_key(event, KEY_W):\n\t\t_keyboard_w_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_throttle()\n\t\treturn true\n\tif _is_key(event, KEY_UP):\n\t\t_keyboard_up_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_throttle()\n\t\treturn true\n\tif _is_key(event, KEY_S):\n\t\t_keyboard_s_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_throttle()\n\t\treturn true\n\tif _is_key(event, KEY_DOWN):\n\t\t_keyboard_down_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_throttle()\n\t\treturn true\n\tif _is_key(event, KEY_A):\n\t\t_keyboard_a_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_steer()\n\t\treturn true\n\tif _is_key(event, KEY_LEFT):\n\t\t_keyboard_left_arrow_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_steer()\n\t\treturn true\n\tif _is_key(event, KEY_D):\n\t\t_keyboard_d_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_steer()\n\t\treturn true\n\tif _is_key(event, KEY_RIGHT):\n\t\t_keyboard_right_arrow_pressed = event.pressed\n\t\t_refresh_keyboard_direction_state()\n\t\t_emit_net_steer()\n\t\treturn true\n\tif _is_key(event, KEY_SPACE):\n\t\t_keyboard_handbrake_pressed = event.pressed\n\t\t_emit_net_handbrake()\n\t\treturn true\n\treturn false\n'''
          if text.count(old_update) != 1:
              raise SystemExit("keyboard update seam changed")
          touch.write_text(text.replace(old_update, new_update, 1))

          helper = Path("scripts/ci/godot_failure_signature.py")
          helper.write_text(r'''#!/usr/bin/env python3
          import re
          import sys
          from pathlib import Path

          ANSI_RE = re.compile(r"\x1b\[[0-9;]*m")
          DIAGNOSTIC_RE = re.compile(
              r"(?:ERROR:|SCRIPT ERROR:|\bFATAL\b|\bPANIC\b|\bCRASH(?:ED)?\b|\bFAIL(?:ED|URE)?\b|\bASSERT(?:ION)?\b)",
              re.IGNORECASE,
          )

          def failure_signature(path: Path) -> tuple[str, ...]:
              lines: list[str] = []
              for raw in path.read_text(errors="replace").splitlines():
                  clean = ANSI_RE.sub("", raw).strip()
                  if not clean or not DIAGNOSTIC_RE.search(clean):
                      continue
                  lines.append(" ".join(clean.split()))
              return tuple(lines)

          def equivalent_failure_signatures(head_log: Path, base_log: Path) -> bool:
              head = failure_signature(head_log)
              base = failure_signature(base_log)
              return bool(head) and bool(base) and head == base

          def main() -> int:
              if len(sys.argv) != 3:
                  print("usage: godot_failure_signature.py HEAD_LOG BASE_LOG", file=sys.stderr)
                  return 2
              head_path = Path(sys.argv[1])
              base_path = Path(sys.argv[2])
              head = failure_signature(head_path)
              base = failure_signature(base_path)
              print(f"HEAD_FAILURE_SIGNATURE={head!r}")
              print(f"BASE_FAILURE_SIGNATURE={base!r}")
              if head and base and head == base:
                  print("FAILURE_SIGNATURE_EQUIVALENT=true")
                  return 0
              print("FAILURE_SIGNATURE_EQUIVALENT=false")
              return 1

          if __name__ == "__main__":
              raise SystemExit(main())
          ''')

          workflow = Path(".github/workflows/godot-web-playtest.yml")
          wf = workflow.read_text()
          old_head = '''          for suite in "${suites[@]}"; do\n            echo "===== HEAD ${suite} =====" | tee -a compatibility_matrix.log\n            set +e\n            timeout 180s "$GODOT_BIN" --headless --path godot -- "$suite" 2>&1 | tee -a compatibility_matrix.log\n            rc=${PIPESTATUS[0]}\n            set -e\n            if [[ $rc -ne 0 ]]; then\n              echo "$suite" | tee -a branch_failures.txt\n            fi\n          done\n'''
          new_head = '''          for suite in "${suites[@]}"; do\n            safe_suite="${suite#--}"\n            head_log="${RUNNER_TEMP}/compat-head-${safe_suite}.log"\n            : > "$head_log"\n            echo "===== HEAD ${suite} =====" | tee -a compatibility_matrix.log\n            set +e\n            timeout 180s "$GODOT_BIN" --headless --path godot -- "$suite" 2>&1 | tee -a compatibility_matrix.log "$head_log"\n            rc=${PIPESTATUS[0]}\n            set -e\n            if [[ $rc -ne 0 ]]; then\n              echo "$suite" | tee -a branch_failures.txt\n            fi\n          done\n'''
          if wf.count(old_head) != 1:
              raise SystemExit("workflow head capture seam changed")
          wf = wf.replace(old_head, new_head, 1)

          old_base = '''          while IFS= read -r suite; do\n            [[ -n "$suite" ]] || continue\n            echo "===== BASE ${suite} =====" | tee -a compatibility_matrix.log\n            set +e\n            timeout 180s "$GODOT_BIN" --headless --path "$baseline_dir/godot" -- "$suite" 2>&1 | tee -a compatibility_matrix.log\n            rc=${PIPESTATUS[0]}\n            set -e\n            if [[ $rc -ne 0 ]]; then\n              echo "$suite" | tee -a baseline_failures.txt\n              echo "PRE_EXISTING_PLATFORM_FAILURE $suite" | tee -a compatibility_classification.log\n            else\n              echo "$suite" | tee -a true_regressions.txt\n              echo "BRANCH_REGRESSION $suite" | tee -a compatibility_classification.log\n            fi\n          done < branch_failures.txt\n'''
          new_base = '''          while IFS= read -r suite; do\n            [[ -n "$suite" ]] || continue\n            safe_suite="${suite#--}"\n            head_log="${RUNNER_TEMP}/compat-head-${safe_suite}.log"\n            base_log="${RUNNER_TEMP}/compat-base-${safe_suite}.log"\n            : > "$base_log"\n            echo "===== BASE ${suite} =====" | tee -a compatibility_matrix.log\n            set +e\n            timeout 180s "$GODOT_BIN" --headless --path "$baseline_dir/godot" -- "$suite" 2>&1 | tee -a compatibility_matrix.log "$base_log"\n            rc=${PIPESTATUS[0]}\n            set -e\n            if [[ $rc -ne 0 ]]; then\n              echo "$suite" | tee -a baseline_failures.txt\n              if python3 scripts/ci/godot_failure_signature.py "$head_log" "$base_log" | tee -a compatibility_classification.log; then\n                echo "PRE_EXISTING_PLATFORM_FAILURE_EQUIVALENT $suite" | tee -a compatibility_classification.log\n              else\n                echo "$suite" | tee -a true_regressions.txt\n                echo "BRANCH_REGRESSION_FAILURE_SIGNATURE_CHANGED $suite" | tee -a compatibility_classification.log\n              fi\n            else\n              echo "$suite" | tee -a true_regressions.txt\n              echo "BRANCH_REGRESSION $suite" | tee -a compatibility_classification.log\n            fi\n          done < branch_failures.txt\n'''
          if wf.count(old_base) != 1:
              raise SystemExit("workflow base classification seam changed")
          wf = wf.replace(old_base, new_base, 1)

          old_prime = '''      - name: Prime exact-head Godot metadata\n        shell: bash\n        run: |\n          set -euo pipefail\n          "$GODOT_BIN" --headless --editor --path godot --quit\n          test -s godot/.godot/global_script_class_cache.cfg\n\n      - name: Run and classify canonical 30-suite matrix\n'''
          new_prime = '''      - name: Test compatibility failure signature classifier\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 scripts/ci/test_godot_failure_signature.py\n\n      - name: Prime exact-head Godot metadata\n        shell: bash\n        run: |\n          set -euo pipefail\n          "$GODOT_BIN" --headless --editor --path godot --quit\n          test -s godot/.godot/global_script_class_cache.cfg\n\n      - name: Run and classify canonical 30-suite matrix\n'''
          if wf.count(old_prime) != 1:
              raise SystemExit("workflow classifier test insertion seam changed")
          workflow.write_text(wf.replace(old_prime, new_prime, 1))
          PY

          python3 scripts/ci/test_godot_failure_signature.py
          "$GODOT_BIN" --headless --path godot --script res://tests/desktop_controls_event_routing_test.gd
          echo "GREEN confirmed for alias ownership and failure-signature classifier."

          rm .github/workflows/repair-pr40-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/godot-web-playtest.yml godot/scripts/input/touch_controls.gd godot/tests/desktop_controls_event_routing_test.gd scripts/ci/godot_failure_signature.py scripts/ci/test_godot_failure_signature.py .github/workflows/repair-pr40-review.yml
          git commit -m "fix(29): harden desktop aliases and compatibility classification"
          git push origin HEAD:chatgpt/desktop-controls-29
